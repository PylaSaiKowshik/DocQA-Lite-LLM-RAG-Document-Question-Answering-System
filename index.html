</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>DocMind</h1>
    <p>Agentic Document Intelligence System</p>
    <div class="badge">LangGraph · ReAct · FAISS · RAPTOR · RoBERTa · LLaMA 3.2</div>
  </div>


  <div class="card">
    <div class="card-title">01 — Upload Document</div>
    <div class="upload-area" id="uploadArea">
      <input type="file" id="pdfUpload" accept="application/pdf">
      <div class="upload-icon">📄</div>
      <div class="upload-text">Drop PDF here or <span>browse</span></div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;">
        Supports digital + scanned PDFs · Any size
      </div>
    </div>
    <div class="upload-status" id="uploadStatus"></div>
  </div>

  
  <div class="card">
    <div class="card-title">02 — Ask Question or Request Summary</div>
    <div class="input-row">
      <input type="text" class="question-input" id="questionInput"
        placeholder="e.g. 'give summary' or 'list all ethical theories' or 'why is AI dangerous?'">
      <button class="submit-btn" id="submitBtn" onclick="askQuestion()">
        Run Agent →
      </button>
    </div>
  </div>

  <div class="card" id="agentPanel">
    <div class="agent-header">
      <div class="agent-spinner" id="agentSpinner"></div>
      <div class="agent-title">AGENT REASONING TRACE</div>
    </div>
    <div class="timeline" id="timeline"></div>
  </div>

  <div class="card" id="answerPanel">
    <div class="card-title">Answer</div>
    <div class="answer-box" id="answerBox"></div>
  </div>

  
  <div class="card" id="metricsPanel">
    <div class="card-title">Benchmark Metrics</div>
    <div class="metrics-grid" id="metricsGrid"></div>
  </div>

</div>

<script>
let uploadedFileName = "";

function formatTime(seconds) {
  seconds = parseFloat(seconds);
  if (isNaN(seconds)) return "—";
  if (seconds < 60) return seconds.toFixed(2) + " sec";
  const mins = Math.floor(seconds / 60);
  const secs = (seconds % 60).toFixed(2);
  return mins + " min " + secs + " sec";
}

function generateId() {
  return Math.random().toString(36).substr(2, 9);
}

// ---- Upload ----
const uploadArea = document.getElementById("uploadArea");
uploadArea.addEventListener("dragover", e => { e.preventDefault(); uploadArea.classList.add("dragover"); });
uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("dragover"));
uploadArea.addEventListener("drop", e => {
  e.preventDefault();
  uploadArea.classList.remove("dragover");
  const file = e.dataTransfer.files[0];
  if (file) { document.getElementById("pdfUpload").files = e.dataTransfer.files; doUpload(file); }
});
document.getElementById("pdfUpload").addEventListener("change", e => {
  if (e.target.files[0]) doUpload(e.target.files[0]);
});

function doUpload(file) {
  const status = document.getElementById("uploadStatus");
  status.className = "upload-status";
  status.textContent = "⏳ Uploading...";
  status.style.display = "block";

  const formData = new FormData();
  formData.append("file", file);

  fetch("upload.php", { method: "POST", body: formData })
    .then(r => r.json())
    .then(data => {
      if (data.status === "success") {
        uploadedFileName = data.filename;
        status.className = "upload-status success";
        status.textContent = "✅ " + uploadedFileName;
        document.querySelector('.upload-icon').textContent = "📋";
      } else {
        status.className = "upload-status error";
        status.textContent = "❌ " + data.message;
      }
    })
    .catch(() => {
      status.className = "upload-status error";
      status.textContent = "❌ Upload failed";
    });
}

// ---- Event type config ----
const EVENT_CONFIG = {
  extract_start:  { icon: "📄", label: "EXTRACTION" },
  workflow_start: { icon: "⚙️", label: "WORKFLOW" },
  agent_start:    { icon: "🤖", label: "AGENT INIT" },
  agent_thought:  { icon: "💭", label: "REASONING" },
  agent_search:   { icon: "🔍", label: "SEARCHING" },
  agent_action:   { icon: "⚡", label: "ACTION" },
  agent_done:     { icon: "✅", label: "COMPLETE" },
  stream_start:   { icon: "✍️", label: "STREAMING" },
  heartbeat:      null,
  done:           null,
  token:          null,  // handled separately
};

function addTimelineEvent(type, message) {
  const cfg = EVENT_CONFIG[type];
  if (!cfg) return;

  const timeline = document.getElementById("timeline");
  const item = document.createElement("div");
  item.className = `timeline-item timeline-line event-${type}`;
  item.innerHTML = `
    <div class="timeline-dot">${cfg.icon}</div>
    <div class="timeline-content">
      <div class="timeline-label">${cfg.label}</div>
      <div class="timeline-message">${message}</div>
    </div>`;
  timeline.appendChild(item);
  item.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

// ---- Ask Question ----
function askQuestion() {
  const question = document.getElementById("questionInput").value.trim();
  if (!question) { alert("Please enter a question."); return; }
  if (!uploadedFileName) { alert("Please upload a PDF first."); return; }

  const requestId = generateId();

  // Detect if summary — no agent steps for summary, skip SSE
  const summaryKeywords = ["summary", "summarize", "overview", "brief", "outline", "gist", "tldr"];
  const isSummary = summaryKeywords.some(k => question.toLowerCase().includes(k));

  // Reset UI
  document.getElementById("agentPanel").style.display = isSummary ? "none" : "block";
  document.getElementById("answerPanel").style.display = "none";
  document.getElementById("metricsPanel").style.display = "none";
  document.getElementById("timeline").innerHTML = "";
  document.getElementById("agentSpinner").style.display = "block";
  document.getElementById("submitBtn").disabled = true;
  document.getElementById("submitBtn").textContent = "Processing...";

  let evtSource = null;

  if (!isSummary) {
    // QA only — open SSE for live agent trace
    evtSource = new EventSource(`ask.php?stream=1&request_id=${requestId}`);

    document.getElementById("answerPanel").style.display = "block";
    document.getElementById("answerBox").textContent = "";
    document.getElementById("answerBox").setAttribute("data-streaming", "true");

    evtSource.onmessage = function(e) {
      const data = JSON.parse(e.data);
      if (data.type === "heartbeat") return;
      if (data.type === "done") {
        evtSource.close();
        document.getElementById("agentSpinner").style.display = "none";
        document.getElementById("answerBox").removeAttribute("data-streaming");
        return;
      }
      if (data.type === "stream_start") {
        document.getElementById("answerPanel").style.display = "block";
        document.getElementById("answerBox").setAttribute("data-streaming", "true");
        return;
      }
      if (data.type === "token") {
        const box = document.getElementById("answerBox");
        document.getElementById("answerPanel").style.display = "block";
        box.textContent += data.message;
        box.scrollTop = box.scrollHeight;
        return;
      }
      addTimelineEvent(data.type, data.message);
    };

    evtSource.onerror = function() { evtSource.close(); };

  } else {
    // Summary — show simple processing message, no SSE needed
    document.getElementById("agentPanel").style.display = "block";
    document.getElementById("timeline").innerHTML = "";
    addTimelineEvent("extract_start", "📄 Extracting PDF text...");
    addTimelineEvent("workflow_start", "⚙️ Running RAPTOR hierarchical summarization...");
  }

  // Send actual request
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 3600000);

  fetch("ask.php", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      question,
      filename: uploadedFileName,
      request_id: requestId
    }),
    signal: controller.signal
  })
  .then(r => r.json())
  .then(data => {
    clearTimeout(timeout);
    if (evtSource) evtSource.close();
    document.getElementById("agentSpinner").style.display = "none";
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").textContent = "Run Agent →";

    // Show answer — only overwrite if streaming didn't fill it
    const box = document.getElementById("answerBox");
    box.removeAttribute("data-streaming");
    document.getElementById("answerPanel").style.display = "block";
    if (!box.textContent.trim() || box.textContent.length < 20) {
      box.textContent = data.answer;
    }

    // Show metrics
    if (data.metrics) showMetrics(data.metrics);
  })
  .catch(err => {
    clearTimeout(timeout);
    if (evtSource) evtSource.close();
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").textContent = "Run Agent →";
    document.getElementById("answerPanel").style.display = "block";
    document.getElementById("answerBox").textContent =
      err.name === "AbortError" ? "Request timed out." : "Error: " + err.message;
  });
}

function scoreClass(val, goodThresh, warnThresh) {
  if (val >= goodThresh) return "good";
  if (val >= warnThresh) return "warn";
  return "bad";
}

function showMetrics(m) {
  const grid = document.getElementById("metricsGrid");
  grid.innerHTML = "";

  // ---- SECTION 1: Core Performance ----
  grid.innerHTML += `<div class="metrics-section-title">📊 Core Performance</div>`;
  const core = [
    { label: "Type",       value: m.type === "summary" ? "Summary" : "Q&A", unit: "" },
    { label: "Total Time", value: formatTime(m.response_time_sec),           unit: "" },
    { label: "Extraction", value: formatTime(m.extraction_time_sec),         unit: "" },
  ];
  if (m.type === "summary") {
    core.push({ label: "Summary Time",   value: formatTime(m.summary_time_sec),               unit: "" });
    core.push({ label: "Summary Length", value: (m.summary_length_words||0).toLocaleString(), unit: "words" });
    core.push({ label: "LLM Calls",      value: m.llm_calls || "—",                           unit: "calls" });
  } else {
    core.push({ label: "QA Time",   value: formatTime(m.qa_time_sec), unit: "" });
    core.push({ label: "Model",     value: m.model_used || "—",       unit: "" });
    core.push({ label: "LLM Calls", value: m.llm_calls ?? "—",        unit: "calls" });
  }
  core.push({ label: "Pages",      value: m.pages_processed,                            unit: "pages" });
  core.push({ label: "Characters", value: (m.characters_processed||0).toLocaleString(), unit: "chars" });
  core.push({ label: "Words",      value: (m.words_processed||0).toLocaleString(),      unit: "words" });
  core.forEach(item => {
    grid.innerHTML += `<div class="metric-item"><div class="metric-label">${item.label}</div><div class="metric-value">${item.value}<span class="metric-unit"> ${item.unit}</span></div></div>`;
  });

  // ---- SECTION 2: Latency Metrics ----
  grid.innerHTML += `<div class="metrics-section-title">⚡ Latency Metrics</div>`;
  const ttft = parseFloat(m.ttft_sec || m.response_time_sec || 0);
  const e2e  = parseFloat(m.e2e_latency_sec || m.response_time_sec || 0);
  const tps  = parseFloat(m.tps || 0);
  [
    { label: "TTFT", sub: "Time To First Token", value: formatTime(ttft),
      note: ttft < e2e ? "✅ Streaming active!" : "= E2E (no streaming yet)",
      cls: ttft < e2e ? "good" : "warn" },
    { label: "E2E Latency", sub: "End To End",   value: formatTime(e2e),  note: "total response time",      cls: "warn" },
    { label: "TPS", sub: "Tokens/Second",        value: tps.toFixed(1),   note: tps >= 5 ? "✅ Fast" : tps >= 2 ? "⚠️ Medium" : "❌ Slow", cls: tps >= 5 ? "good" : tps >= 2 ? "warn" : "bad" },
  ].forEach(item => {
    grid.innerHTML += `<div class="metric-item ${item.cls}"><div class="metric-label">${item.label} <span style="color:var(--muted);font-weight:400">· ${item.sub}</span></div><div class="metric-value">${item.value}</div><div style="font-size:10px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;">${item.note}</div></div>`;
  });

  // ---- SECTION 3: RAG Quality Metrics (QA only) ----
  if (m.type !== "summary") {
    grid.innerHTML += `<div class="metrics-section-title">🎯 RAG Quality Metrics</div>`;
    const retrieval = parseFloat(m.retrieval_score   || 0);
    const precision = parseFloat(m.context_precision || 0);
    const grounding = parseFloat(m.answer_grounding  || 0);
    const conf      = parseFloat((m.confidence_score || 0) * 100);
    [
      { label: "Retrieval Score",    sub: "Chunk Relevance",     value: retrieval.toFixed(1)+"%", note: retrieval >= 40 ? "✅ Good" : "⚠️ Low",        cls: scoreClass(retrieval, 40, 25) },
      { label: "Context Precision",  sub: "Relevant/Retrieved",  value: precision.toFixed(1)+"%", note: precision >= 60 ? "✅ Precise" : "⚠️ Noisy",    cls: scoreClass(precision, 60, 40) },
      { label: "Answer Grounding",   sub: "Grounded in Doc",     value: grounding.toFixed(1)+"%", note: grounding >= 50 ? "✅ Grounded" : "⚠️ Hallucination risk", cls: scoreClass(grounding, 50, 30) },
      { label: "Confidence",         sub: "Model Certainty",     value: conf.toFixed(1)+"%",      note: conf >= 30 ? "✅ Confident" : "⚠️ Uncertain",   cls: scoreClass(conf, 30, 15) },
    ].forEach(item => {
      grid.innerHTML += `<div class="metric-item ${item.cls}"><div class="metric-label">${item.label} <span style="color:var(--muted);font-weight:400">· ${item.sub}</span></div><div class="metric-value">${item.value}</div><div style="font-size:10px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;">${item.note}</div></div>`;
    });
  }

  document.getElementById("metricsPanel").style.display = "block";
}

// Enter key submits
document.getElementById("questionInput").addEventListener("keydown", e => {
  if (e.key === "Enter") askQuestion();
});
</script>
</body>
</html>   -->

/* Answer box */

.answer-box[data-streaming]::after {

.answer-box {

/* Latency highlight */

/* Section divider */
.metrics-section-title {

  color: var(--accent);
  text-transform: uppercase;

}

/* Metric color classes */
.metric-item.good .metric-value { color: var(--accent2); }
.metric-item.warn .metric-value { color: var(--accent3); }
.metric-item.bad  .metric-value { color: #ef4444; }

/* Section dividers */
.metrics-section-title {
  grid-column: 1/-1;
  border-top: 1px solid var(--border);
  margin: 4px 0;
  padding-top: 10px;
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--accent);
  text-transform: uppercase;

}

/* Metrics */
#metricsPanel { display: none; }

.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));

<body>

<div class="container">

  
  <div class="header">
    <h1>DocMind</h1>
    <p>Agentic Document Intelligence System</p>
    <div class="badge">LangGraph · ReAct · FAISS · RAPTOR · RoBERTa · LLaMA 3.2</div>
  </div>

 
  <div class="card">
    <div class="card-title">01 — Upload Document</div>
    <div class="upload-area" id="uploadArea">
      <input type="file" id="pdfUpload" accept="application/pdf">
      <div class="upload-icon">📄</div>
      <div class="upload-text">Drop PDF here or <span>browse</span></div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;">
        Supports digital + scanned PDFs · Any size
      </div>
    </div>
    <div class="upload-status" id="uploadStatus"></div>
  </div>

  
  <div class="card">
    <div class="card-title">02 — Ask Question or Request Summary</div>
    <div class="input-row">
      <input type="text" class="question-input" id="questionInput"
        placeholder="e.g. 'give summary' or 'list all ethical theories' or 'why is AI dangerous?'">
      <button class="submit-btn" id="submitBtn" onclick="askQuestion()">
        Run Agent →
      </button>
    </div>
  </div>


  <div class="card" id="agentPanel">
    <div class="agent-header">
      <div class="agent-spinner" id="agentSpinner"></div>
      <div class="agent-title">AGENT REASONING TRACE</div>
    </div>
    <div class="timeline" id="timeline"></div>
  </div>


  <div class="card" id="answerPanel">
    <div class="card-title">Answer</div>
    <div class="answer-box" id="answerBox"></div>
  </div>


  <div class="card" id="metricsPanel">
    <div class="card-title">Benchmark Metrics</div>
    <div class="metrics-grid" id="metricsGrid"></div>
  </div>

</div>

<script>
let uploadedFileName = "";

function formatTime(seconds) {
  seconds = parseFloat(seconds);
  if (isNaN(seconds)) return "—";
  if (seconds < 60) return seconds.toFixed(2) + " sec";
  const mins = Math.floor(seconds / 60);
  const secs = (seconds % 60).toFixed(2);
  return mins + " min " + secs + " sec";
}

function generateId() {
  return Math.random().toString(36).substr(2, 9);
}


const uploadArea = document.getElementById("uploadArea");
uploadArea.addEventListener("dragover", e => { e.preventDefault(); uploadArea.classList.add("dragover"); });
uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("dragover"));
uploadArea.addEventListener("drop", e => {
  e.preventDefault();
  uploadArea.classList.remove("dragover");
  const file = e.dataTransfer.files[0];
  if (file) { document.getElementById("pdfUpload").files = e.dataTransfer.files; doUpload(file); }
});
document.getElementById("pdfUpload").addEventListener("change", e => {
  if (e.target.files[0]) doUpload(e.target.files[0]);
});

function doUpload(file) {
  const status = document.getElementById("uploadStatus");
  status.className = "upload-status";
  status.textContent = "⏳ Uploading...";
  status.style.display = "block";

  const formData = new FormData();
  formData.append("file", file);

  fetch("upload.php", { method: "POST", body: formData })
    .then(r => r.json())
    .then(data => {
      if (data.status === "success") {
        uploadedFileName = data.filename;
        status.className = "upload-status success";
        status.textContent = "✅ " + uploadedFileName;
        document.querySelector('.upload-icon').textContent = "📋";
      } else {
        status.className = "upload-status error";
        status.textContent = "❌ " + data.message;
      }
    })
    .catch(() => {
      status.className = "upload-status error";
      status.textContent = "❌ Upload failed";
    });
}

// ---- Event type config ----
const EVENT_CONFIG = {
  extract_start:  { icon: "📄", label: "EXTRACTION" },
  workflow_start: { icon: "⚙️", label: "WORKFLOW" },
  agent_start:    { icon: "🤖", label: "AGENT INIT" },
  agent_thought:  { icon: "💭", label: "REASONING" },
  agent_search:   { icon: "🔍", label: "SEARCHING" },
  agent_action:   { icon: "⚡", label: "ACTION" },
  agent_done:     { icon: "✅", label: "COMPLETE" },
  stream_start:   { icon: "✍️", label: "STREAMING" },
  heartbeat:      null,
  done:           null,
  token:          null,  // handled separately
};

function addTimelineEvent(type, message) {
  const cfg = EVENT_CONFIG[type];
  if (!cfg) return;

  const timeline = document.getElementById("timeline");
  const item = document.createElement("div");
  item.className = `timeline-item timeline-line event-${type}`;
  item.innerHTML = `
    <div class="timeline-dot">${cfg.icon}</div>
    <div class="timeline-content">
      <div class="timeline-label">${cfg.label}</div>
      <div class="timeline-message">${message}</div>
    </div>`;
  timeline.appendChild(item);
  item.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

// ---- Ask Question ----
function askQuestion() {
  const question = document.getElementById("questionInput").value.trim();
  if (!question) { alert("Please enter a question."); return; }
  if (!uploadedFileName) { alert("Please upload a PDF first."); return; }

  const requestId = generateId();

  // Detect if summary — no agent steps for summary, skip SSE
  const summaryKeywords = ["summary", "summarize", "overview", "brief", "outline", "gist", "tldr"];
  const isSummary = summaryKeywords.some(k => question.toLowerCase().includes(k));

  // Reset UI
  document.getElementById("agentPanel").style.display = isSummary ? "none" : "block";
  document.getElementById("answerPanel").style.display = "none";
  document.getElementById("metricsPanel").style.display = "none";
  document.getElementById("timeline").innerHTML = "";
  document.getElementById("agentSpinner").style.display = "block";
  document.getElementById("submitBtn").disabled = true;
  document.getElementById("submitBtn").textContent = "Processing...";

  let evtSource = null;

  if (!isSummary) {
    // QA only — open SSE for live agent trace
    evtSource = new EventSource(`ask.php?stream=1&request_id=${requestId}`);

    document.getElementById("answerPanel").style.display = "block";
    document.getElementById("answerBox").textContent = "";
    document.getElementById("answerBox").setAttribute("data-streaming", "true");

    evtSource.onmessage = function(e) {
      const data = JSON.parse(e.data);
      if (data.type === "heartbeat") return;
      if (data.type === "done") {
        evtSource.close();
        document.getElementById("agentSpinner").style.display = "none";
        document.getElementById("answerBox").removeAttribute("data-streaming");
        return;
      }
      if (data.type === "token") {
        const box = document.getElementById("answerBox");
        box.textContent += data.message;
        box.scrollTop = box.scrollHeight;
        return;
      }
      addTimelineEvent(data.type, data.message);
    };

    evtSource.onerror = function() { evtSource.close(); };

  } else {
    // Summary — show simple processing message, no SSE needed
    document.getElementById("agentPanel").style.display = "block";
    document.getElementById("timeline").innerHTML = "";
    addTimelineEvent("extract_start", "📄 Extracting PDF text...");
    addTimelineEvent("workflow_start", "⚙️ Running RAPTOR hierarchical summarization...");
  }

  // Send actual request
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 3600000);

  fetch("ask.php", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      question,
      filename: uploadedFileName,
      request_id: requestId
    }),
    signal: controller.signal
  })
  .then(r => r.json())
  .then(data => {
    clearTimeout(timeout);
    if (evtSource) evtSource.close();
    document.getElementById("agentSpinner").style.display = "none";
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").textContent = "Run Agent →";

    // Show answer
    const box = document.getElementById("answerBox");
    document.getElementById("answerPanel").style.display = "block";
    if (!box.textContent.trim() || box.textContent.length < 20) {
      box.textContent = data.answer;
    }

    // Show metrics
    if (data.metrics) showMetrics(data.metrics);
  })
  .catch(err => {
    clearTimeout(timeout);
    if (evtSource) evtSource.close();
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").textContent = "Run Agent →";
    document.getElementById("answerPanel").style.display = "block";
    document.getElementById("answerBox").textContent =
      err.name === "AbortError" ? "Request timed out." : "Error: " + err.message;
  });
}

function scoreClass(val, goodThresh, warnThresh) {
  if (val >= goodThresh) return "good";
  if (val >= warnThresh) return "warn";
  return "bad";
}

function showMetrics(m) {
  const grid = document.getElementById("metricsGrid");
  grid.innerHTML = "";

  // ---- SECTION 1: Core Performance ----
  grid.innerHTML += `<div class="metrics-section-title">📊 Core Performance</div>`;
  const core = [
    { label: "Type",       value: m.type === "summary" ? "Summary" : "Q&A", unit: "" },
    { label: "Total Time", value: formatTime(m.response_time_sec),           unit: "" },
    { label: "Extraction", value: formatTime(m.extraction_time_sec),         unit: "" },
  ];
  if (m.type === "summary") {
    core.push({ label: "Summary Time",   value: formatTime(m.summary_time_sec),               unit: "" });
    core.push({ label: "Summary Length", value: (m.summary_length_words||0).toLocaleString(), unit: "words" });
    core.push({ label: "LLM Calls",      value: m.llm_calls || "—",                           unit: "calls" });
  } else {
    core.push({ label: "QA Time",   value: formatTime(m.qa_time_sec), unit: "" });
    core.push({ label: "Model",     value: m.model_used || "—",       unit: "" });
    core.push({ label: "LLM Calls", value: m.llm_calls ?? "—",        unit: "calls" });
  }
  core.push({ label: "Pages",      value: m.pages_processed,                            unit: "pages" });
  core.push({ label: "Characters", value: (m.characters_processed||0).toLocaleString(), unit: "chars" });
  core.push({ label: "Words",      value: (m.words_processed||0).toLocaleString(),      unit: "words" });
  core.forEach(item => {
    grid.innerHTML += `<div class="metric-item"><div class="metric-label">${item.label}</div><div class="metric-value">${item.value}<span class="metric-unit"> ${item.unit}</span></div></div>`;
  });

  // ---- SECTION 2: Latency Metrics ----
  grid.innerHTML += `<div class="metrics-section-title">⚡ Latency Metrics</div>`;
  const ttft = parseFloat(m.ttft_sec || m.response_time_sec || 0);
  const e2e  = parseFloat(m.e2e_latency_sec || m.response_time_sec || 0);
  const tps  = parseFloat(m.tps || 0);
  [
    { label: "TTFT", sub: "Time To First Token", value: formatTime(ttft), note: ttft < 10 ? "✅ Streaming active!" : "= E2E (no streaming yet)", cls: ttft < 10 ? "good" : "warn" },
    { label: "E2E Latency", sub: "End To End",   value: formatTime(e2e),  note: "total response time",      cls: "warn" },
    { label: "TPS", sub: "Tokens/Second",        value: tps.toFixed(1),   note: tps >= 5 ? "✅ Fast" : tps >= 2 ? "⚠️ Medium" : "❌ Slow", cls: tps >= 5 ? "good" : tps >= 2 ? "warn" : "bad" },
  ].forEach(item => {
    grid.innerHTML += `<div class="metric-item ${item.cls}"><div class="metric-label">${item.label} <span style="color:var(--muted);font-weight:400">· ${item.sub}</span></div><div class="metric-value">${item.value}</div><div style="font-size:10px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;">${item.note}</div></div>`;
  });

  // ---- SECTION 3: RAG Quality Metrics (QA only) ----
  if (m.type !== "summary") {
    grid.innerHTML += `<div class="metrics-section-title">🎯 RAG Quality Metrics</div>`;
    const retrieval = parseFloat(m.retrieval_score   || 0);
    const precision = parseFloat(m.context_precision || 0);
    const grounding = parseFloat(m.answer_grounding  || 0);
    const conf      = parseFloat((m.confidence_score || 0) * 100);
    [
      { label: "Retrieval Score",    sub: "Chunk Relevance",     value: retrieval.toFixed(1)+"%", note: retrieval >= 40 ? "✅ Good" : "⚠️ Low",        cls: scoreClass(retrieval, 40, 25) },
      { label: "Context Precision",  sub: "Relevant/Retrieved",  value: precision.toFixed(1)+"%", note: precision >= 60 ? "✅ Precise" : "⚠️ Noisy",    cls: scoreClass(precision, 60, 40) },
      { label: "Answer Grounding",   sub: "Grounded in Doc",     value: grounding.toFixed(1)+"%", note: grounding >= 50 ? "✅ Grounded" : "⚠️ Hallucination risk", cls: scoreClass(grounding, 50, 30) },
      { label: "Confidence",         sub: "Model Certainty",     value: conf.toFixed(1)+"%",      note: conf >= 30 ? "✅ Confident" : "⚠️ Uncertain",   cls: scoreClass(conf, 30, 15) },
    ].forEach(item => {
      grid.innerHTML += `<div class="metric-item ${item.cls}"><div class="metric-label">${item.label} <span style="color:var(--muted);font-weight:400">· ${item.sub}</span></div><div class="metric-value">${item.value}</div><div style="font-size:10px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;">${item.note}</div></div>`;
    });
  }

  document.getElementById("metricsPanel").style.display = "block";
}

// Enter key submits
document.getElementById("questionInput").addEventListener("keydown", e => {
  if (e.key === "Enter") askQuestion();
});
</script>

<div class="container">

  <div class="card">

        Supports digital + scanned PDFs · Any size

    </div>

  </div>

        placeholder="e.g. 'give summary' or 'list all ethical theories' or 'why is AI dangerous?'">
      <button class="submit-btn" id="submitBtn" onclick="askQuestion()">
        Run Agent →
      </button>

  </div>

    <div class="card-title">Answer</div>
    <div class="answer-box" id="answerBox"></div>
  </div>

    <div class="card-title">Benchmark Metrics</div>
    <div class="metrics-grid" id="metricsGrid"></div>
  </div>

</div>

<script>
let uploadedFileName = "";

function formatTime(seconds) {
  seconds = parseFloat(seconds);
  if (isNaN(seconds)) return "—";
  if (seconds < 60) return seconds.toFixed(2) + " sec";
  const mins = Math.floor(seconds / 60);
  const secs = (seconds % 60).toFixed(2);
  return mins + " min " + secs + " sec";
}

function generateId() {
  return Math.random().toString(36).substr(2, 9);
}

// ---- Upload ----
const uploadArea = document.getElementById("uploadArea");
uploadArea.addEventListener("dragover", e => { e.preventDefault(); uploadArea.classList.add("dragover"); });
uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("dragover"));
uploadArea.addEventListener("drop", e => {
  e.preventDefault();
  uploadArea.classList.remove("dragover");
  const file = e.dataTransfer.files[0];
  if (file) { document.getElementById("pdfUpload").files = e.dataTransfer.files; doUpload(file); }
});
document.getElementById("pdfUpload").addEventListener("change", e => {
  if (e.target.files[0]) doUpload(e.target.files[0]);
});

function doUpload(file) {
  const status = document.getElementById("uploadStatus");
  status.className = "upload-status";
  status.textContent = "⏳ Uploading...";
  status.style.display = "block";

  const formData = new FormData();
  formData.append("file", file);

  fetch("upload.php", { method: "POST", body: formData })
    .then(r => r.json())
    .then(data => {
      if (data.status === "success") {
        uploadedFileName = data.filename;
        status.className = "upload-status success";
        status.textContent = "✅ " + uploadedFileName;
        document.querySelector('.upload-icon').textContent = "📋";
      } else {
        status.className = "upload-status error";
        status.textContent = "❌ " + data.message;
      }
    })
    .catch(() => {
      status.className = "upload-status error";
      status.textContent = "❌ Upload failed";
    });
}

// ---- Event type config ----
const EVENT_CONFIG = {
  extract_start:  { icon: "📄", label: "EXTRACTION" },
  workflow_start: { icon: "⚙️", label: "WORKFLOW" },
  agent_start:    { icon: "🤖", label: "AGENT INIT" },
  agent_thought:  { icon: "💭", label: "REASONING" },
  agent_search:   { icon: "🔍", label: "SEARCHING" },
  agent_action:   { icon: "⚡", label: "ACTION" },
  agent_done:     { icon: "✅", label: "COMPLETE" },
  stream_start:   { icon: "✍️", label: "STREAMING" },
  heartbeat:      null,
  done:           null,
  token:          null,  // handled separately
};

function addTimelineEvent(type, message) {
  const cfg = EVENT_CONFIG[type];
  if (!cfg) return;

  const timeline = document.getElementById("timeline");
  const item = document.createElement("div");
  item.className = `timeline-item timeline-line event-${type}`;
  item.innerHTML = `
    <div class="timeline-dot">${cfg.icon}</div>
    <div class="timeline-content">
      <div class="timeline-label">${cfg.label}</div>
      <div class="timeline-message">${message}</div>
    </div>`;
  timeline.appendChild(item);
  item.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

// ---- Ask Question ----
function askQuestion() {
  const question = document.getElementById("questionInput").value.trim();
  if (!question) { alert("Please enter a question."); return; }
  if (!uploadedFileName) { alert("Please upload a PDF first."); return; }

  const requestId = generateId();

  // Detect if summary — no agent steps for summary, skip SSE
  const summaryKeywords = ["summary", "summarize", "overview", "brief", "outline", "gist", "tldr"];
  const isSummary = summaryKeywords.some(k => question.toLowerCase().includes(k));

  // Reset UI
  document.getElementById("agentPanel").style.display = isSummary ? "none" : "block";
  document.getElementById("answerPanel").style.display = "none";
  document.getElementById("metricsPanel").style.display = "none";
  document.getElementById("timeline").innerHTML = "";
  document.getElementById("agentSpinner").style.display = "block";
  document.getElementById("submitBtn").disabled = true;
  document.getElementById("submitBtn").textContent = "Processing...";

  let evtSource = null;

  if (!isSummary) {
    // QA only — open SSE for live agent trace
    evtSource = new EventSource(`ask.php?stream=1&request_id=${requestId}`);

    document.getElementById("answerPanel").style.display = "block";
    document.getElementById("answerBox").textContent = "";
    document.getElementById("answerBox").setAttribute("data-streaming", "true");

    evtSource.onmessage = function(e) {
      const data = JSON.parse(e.data);
      if (data.type === "heartbeat") return;
      if (data.type === "done") {
        evtSource.close();
        document.getElementById("agentSpinner").style.display = "none";
        document.getElementById("answerBox").removeAttribute("data-streaming");
        return;
      }
      if (data.type === "token") {
        const box = document.getElementById("answerBox");
        box.textContent += data.message;
        box.scrollTop = box.scrollHeight;
        return;
      }
      addTimelineEvent(data.type, data.message);
    };

    evtSource.onerror = function() { evtSource.close(); };

  } else {
    // Summary — show simple processing message, no SSE needed
    document.getElementById("agentPanel").style.display = "block";
    document.getElementById("timeline").innerHTML = "";
    addTimelineEvent("extract_start", "📄 Extracting PDF text...");
    addTimelineEvent("workflow_start", "⚙️ Running RAPTOR hierarchical summarization...");
  }

  // Send actual request
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 3600000);

  fetch("ask.php", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      question,
      filename: uploadedFileName,
      request_id: requestId
    }),
    signal: controller.signal
  })
  .then(r => r.json())
  .then(data => {
    clearTimeout(timeout);
    if (evtSource) evtSource.close();
    document.getElementById("agentSpinner").style.display = "none";
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").textContent = "Run Agent →";

    // Show answer
    const box = document.getElementById("answerBox");
    document.getElementById("answerPanel").style.display = "block";
    if (!box.textContent.trim() || box.textContent.length < 20) {
      box.textContent = data.answer;
    }

    // Show metrics
    if (data.metrics) showMetrics(data.metrics);
  })
  .catch(err => {
    clearTimeout(timeout);
    if (evtSource) evtSource.close();
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").textContent = "Run Agent →";
    document.getElementById("answerPanel").style.display = "block";
    document.getElementById("answerBox").textContent =
      err.name === "AbortError" ? "Request timed out." : "Error: " + err.message;
  });
}

function showMetrics(m) {
  const grid = document.getElementById("metricsGrid");
  grid.innerHTML = "";

  const items = [
    { label: "Type",           value: m.type === "summary" ? "Summary" : "Q&A",  unit: "" },
    { label: "Total Time",     value: formatTime(m.response_time_sec),             unit: "" },
    { label: "Extraction",     value: formatTime(m.extraction_time_sec),           unit: "" },
  ];

  if (m.type === "summary") {
    items.push({ label: "Summary Time",   value: formatTime(m.summary_time_sec),           unit: "" });
    items.push({ label: "Summary Length", value: (m.summary_length_words||0).toLocaleString(), unit: "words" });
  } else {
    items.push({ label: "QA Time",        value: formatTime(m.qa_time_sec),                unit: "" });
    items.push({ label: "Confidence",     value: ((m.confidence_score||0)*100).toFixed(1), unit: "%" });
    items.push({ label: "Model",          value: m.model_used || "—",                      unit: "" });
  }

  items.push({ label: "Pages",      value: m.pages_processed,                           unit: "pages" });
  items.push({ label: "Characters", value: (m.characters_processed||0).toLocaleString(), unit: "chars" });
  items.push({ label: "Words",      value: (m.words_processed||0).toLocaleString(),      unit: "words" });

  items.forEach(item => {
    grid.innerHTML += `
      <div class="metric-item">
        <div class="metric-label">${item.label}</div>
        <div class="metric-value">${item.value}<span class="metric-unit"> ${item.unit}</span></div>
      </div>`;
  });

  // ---- LATENCY SECTION ----
  const ttft = parseFloat(m.ttft_sec || m.response_time_sec || 0);
  const e2e  = parseFloat(m.e2e_latency_sec || m.response_time_sec || 0);
  const tps  = parseFloat(m.tps || 0);

  // Divider
  grid.innerHTML += `
    <div style="grid-column:1/-1; border-top:1px solid var(--border);
                margin: 4px 0; padding-top: 10px;">
      <div style="font-size:10px; font-family:'JetBrains Mono',monospace;
                  color:var(--accent); text-transform:uppercase;
                  letter-spacing:0.1em; margin-bottom:8px;">
        ⚡ Latency Metrics (Before Streaming)
      </div>
    </div>`;

  const latencyItems = [
    {
      label: "TTFT",
      sublabel: "Time To First Token",
      value: formatTime(ttft),
      note: "= E2E (no streaming yet)",
      cls: "latency-bad"
    },
    {
      label: "E2E Latency",
      sublabel: "End To End",
      value: formatTime(e2e),
      note: "total response time",
      cls: "latency-bad"
    },
    {
      label: "TPS",
      sublabel: "Tokens / Second",
      value: tps.toFixed(1),
      note: "output speed",
      cls: "latency"
    },
  ];

  latencyItems.forEach(item => {
    grid.innerHTML += `
      <div class="metric-item ${item.cls}">
        <div class="metric-label">${item.label}
          <span style="color:var(--muted);font-weight:400"> · ${item.sublabel}</span>
        </div>
        <div class="metric-value">${item.value}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:4px;
                    font-family:'JetBrains Mono',monospace;">${item.note}</div>
      </div>`;
  });

  document.getElementById("metricsPanel").style.display = "block";
}

// Enter key submits
document.getElementById("questionInput").addEventListener("keydown", e => {
  if (e.key === "Enter") askQuestion();
});
</script>
</body>
</html> -->

      </button>

    <div class="metrics-grid" id="metricsGrid"></div>

<script>
let uploadedFileName = "";

function formatTime(seconds) {
  seconds = parseFloat(seconds);
  if (isNaN(seconds)) return "—";
  if (seconds < 60) return seconds.toFixed(2) + " sec";
  const mins = Math.floor(seconds / 60);
  const secs = (seconds % 60).toFixed(2);
  return mins + " min " + secs + " sec";
}

function generateId() {
  return Math.random().toString(36).substr(2, 9);
}

// ---- Upload ----
const uploadArea = document.getElementById("uploadArea");
uploadArea.addEventListener("dragover", e => { e.preventDefault(); uploadArea.classList.add("dragover"); });
uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("dragover"));
uploadArea.addEventListener("drop", e => {
  e.preventDefault();
  uploadArea.classList.remove("dragover");
  const file = e.dataTransfer.files[0];
  if (file) { document.getElementById("pdfUpload").files = e.dataTransfer.files; doUpload(file); }
});
document.getElementById("pdfUpload").addEventListener("change", e => {
  if (e.target.files[0]) doUpload(e.target.files[0]);
});

function doUpload(file) {
  const status = document.getElementById("uploadStatus");
  status.className = "upload-status";
  status.textContent = "⏳ Uploading...";
  status.style.display = "block";

  const formData = new FormData();
  formData.append("file", file);

  fetch("upload.php", { method: "POST", body: formData })
    .then(r => r.json())
    .then(data => {
      if (data.status === "success") {
        uploadedFileName = data.filename;
        status.className = "upload-status success";
        status.textContent = "✅ " + uploadedFileName;
        document.querySelector('.upload-icon').textContent = "📋";
      } else {
        status.className = "upload-status error";
        status.textContent = "❌ " + data.message;
      }
    })
    .catch(() => {
      status.className = "upload-status error";
      status.textContent = "❌ Upload failed";
    });
}

// ---- Event type config ----
const EVENT_CONFIG = {
  extract_start:  { icon: "📄", label: "EXTRACTION" },
  workflow_start: { icon: "⚙️", label: "WORKFLOW" },
  agent_start:    { icon: "🤖", label: "AGENT INIT" },
  agent_thought:  { icon: "💭", label: "REASONING" },
  agent_search:   { icon: "🔍", label: "SEARCHING" },
  agent_action:   { icon: "⚡", label: "ACTION" },
  agent_done:     { icon: "✅", label: "COMPLETE" },
  heartbeat:      null,
  done:           null,
};

function addTimelineEvent(type, message) {
  const cfg = EVENT_CONFIG[type];
  if (!cfg) return;

  const timeline = document.getElementById("timeline");
  const item = document.createElement("div");
  item.className = `timeline-item timeline-line event-${type}`;
  item.innerHTML = `
    <div class="timeline-dot">${cfg.icon}</div>
    <div class="timeline-content">
      <div class="timeline-label">${cfg.label}</div>
      <div class="timeline-message">${message}</div>
    </div>`;
  timeline.appendChild(item);
  item.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

// ---- Ask Question ----
function askQuestion() {
  const question = document.getElementById("questionInput").value.trim();
  if (!question) { alert("Please enter a question."); return; }
  if (!uploadedFileName) { alert("Please upload a PDF first."); return; }

  const requestId = generateId();

  // Reset UI
  document.getElementById("agentPanel").style.display = "block";
  document.getElementById("answerPanel").style.display = "none";
  document.getElementById("metricsPanel").style.display = "none";
  document.getElementById("timeline").innerHTML = "";
  document.getElementById("agentSpinner").style.display = "block";
  document.getElementById("submitBtn").disabled = true;
  document.getElementById("submitBtn").textContent = "Processing...";

  // Connect to SSE stream FIRST
  const evtSource = new EventSource(`ask.php?stream=1&request_id=${requestId}`);

  evtSource.onmessage = function(e) {
    const data = JSON.parse(e.data);
    if (data.type === "heartbeat") return;
    if (data.type === "done") {
      evtSource.close();
      document.getElementById("agentSpinner").style.display = "none";
      return;
    }
    addTimelineEvent(data.type, data.message);
  };

  evtSource.onerror = function() { evtSource.close(); };

  // Send actual request
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 3600000);

  fetch("ask.php", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      question,
      filename: uploadedFileName,
      request_id: requestId
    }),
    signal: controller.signal
  })
  .then(r => r.json())
  .then(data => {
    clearTimeout(timeout);
    evtSource.close();
    document.getElementById("agentSpinner").style.display = "none";
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").textContent = "Run Agent →";

    // Show answer
    document.getElementById("answerPanel").style.display = "block";
    document.getElementById("answerBox").textContent = data.answer;

    // Show metrics
    if (data.metrics) showMetrics(data.metrics);
  })
  .catch(err => {
    clearTimeout(timeout);
    evtSource.close();
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").textContent = "Run Agent →";
    document.getElementById("answerPanel").style.display = "block";
    document.getElementById("answerBox").textContent =
      err.name === "AbortError" ? "Request timed out." : "Error: " + err.message;
  });
}

function showMetrics(m) {
  const grid = document.getElementById("metricsGrid");
  grid.innerHTML = "";

  const items = [
    { label: "Type",           value: m.type === "summary" ? "Summary" : "Q&A",  unit: "" },
    { label: "Total Time",     value: formatTime(m.response_time_sec),             unit: "" },
    { label: "Extraction",     value: formatTime(m.extraction_time_sec),           unit: "" },
  ];

  if (m.type === "summary") {
    items.push({ label: "Summary Time",   value: formatTime(m.summary_time_sec),           unit: "" });
    items.push({ label: "Summary Length", value: (m.summary_length_words||0).toLocaleString(), unit: "words" });
  } else {
    items.push({ label: "QA Time",        value: formatTime(m.qa_time_sec),                unit: "" });
    items.push({ label: "Confidence",     value: ((m.confidence_score||0)*100).toFixed(1), unit: "%" });
    items.push({ label: "Model",          value: m.model_used || "—",                      unit: "" });
  }

  items.push({ label: "Pages",      value: m.pages_processed,                           unit: "pages" });
  items.push({ label: "Characters", value: (m.characters_processed||0).toLocaleString(), unit: "chars" });
  items.push({ label: "Words",      value: (m.words_processed||0).toLocaleString(),      unit: "words" });

  items.forEach(item => {
    grid.innerHTML += `
      <div class="metric-item">
        <div class="metric-label">${item.label}</div>
        <div class="metric-value">${item.value}<span class="metric-unit"> ${item.unit}</span></div>
      </div>`;
  });

  document.getElementById("metricsPanel").style.display = "block";
}

// Enter key submits
document.getElementById("questionInput").addEventListener("keydown", e => {
  if (e.key === "Enter") askQuestion();
});
</script>
</body>
</html>

    color: #94a3b8;
    margin-left: 2px;
}

.spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 3px solid rgba(0,0,0,0.2);
    border-top-color: #0284c7;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-left: 8px;
    vertical-align: middle;
}

@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<body>

<h1>Generative AI PDF Q&A</h1>

<div class="card" id="uploadCard">
    <h2>Upload PDF</h2>
    <input type="file" id="pdfUpload" accept="application/pdf">
    <button onclick="uploadPDF()">Upload PDF</button>
</div>

<div class="card" id="questionCard">
    <h2>Ask a Question / Get Summary</h2>
    <input type="text" id="questionInput" placeholder="Enter your question or type 'summary'">
    <button onclick="askQuestion()">Submit</button>
</div>

<div id="answerContainer">Waiting for input...</div>


<div id="metricsContainer">
    <h3>Benchmark Metrics</h3>
    <div class="metrics-grid" id="metricsGrid"></div>
</div>

<script>
let uploadedFileName = "";

function uploadPDF() {
    const fileInput = document.getElementById("pdfUpload");
    const pdfFile = fileInput.files[0];
    if (!pdfFile) { alert("Please select a PDF file first."); return; }

    const formData = new FormData();
    formData.append("file", pdfFile);

    const answerBox = document.getElementById("answerContainer");
    answerBox.innerHTML = '⚙ Processing PDF... please wait <span class="spinner"></span>';
    document.getElementById("metricsContainer").style.display = "none";

    fetch("upload.php", { method: "POST", body: formData })
    .then(res => res.json())
    .then(data => {
        if (data.status === "success") {
            uploadedFileName = data.filename;
            answerBox.innerText = "✅ PDF uploaded: " + uploadedFileName;
        } else {
            answerBox.innerText = "❌ Upload failed: " + data.message;
        }
    })
    .catch(err => {
        console.error(err);
        answerBox.innerText = "❌ Upload failed. Check console.";
    });
}

function askQuestion() {
    const question = document.getElementById("questionInput").value.trim();
    if (!question) { alert("Please enter a question or type 'summary'."); return; }
    if (!uploadedFileName) { alert("Please upload a PDF first."); return; }

    const answerBox = document.getElementById("answerContainer");
    const metricsContainer = document.getElementById("metricsContainer");

    answerBox.innerHTML = '⚙ Processing... please wait (large PDFs may take a few minutes) <span class="spinner"></span>';
    metricsContainer.style.display = "none";

    // 60minute browser timeout
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 3600000); // 1 hour

    fetch("ask.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, filename: uploadedFileName }),
        signal: controller.signal
    })
    .then(res => res.json())
    .then(data => {
        clearTimeout(timeout);

        // Show answer
        answerBox.innerText = data.answer;

        // Show metrics if present
        if (data.metrics) {
            showMetrics(data.metrics);
        }
    })
    .catch(err => {
        clearTimeout(timeout);
        console.error(err);
        if (err.name === "AbortError") {
            answerBox.innerText = "❌ Request timed out after 10 minutes.";
        } else {
            answerBox.innerText = "❌ Error retrieving answer.";
        }
    });
}

function showMetrics(m) {
    const metricsContainer = document.getElementById("metricsContainer");
    const grid = document.getElementById("metricsGrid");
    grid.innerHTML = "";

    // Build metrics based on type
    const items = [
        { label: "Type", value: m.type === "summary" ? "Summary" : "Q&A", unit: "" },
        { label: "Total Response Time", value: m.response_time_sec, unit: "sec" },
        { label: "Extraction Time", value: m.extraction_time_sec, unit: "sec" },
    ];

    if (m.type === "summary") {
        items.push({ label: "Summary Time", value: m.summary_time_sec, unit: "sec" });
        items.push({ label: "Summary Length", value: m.summary_length_words, unit: "words" });
    } else {
        items.push({ label: "QA Time", value: m.qa_time_sec, unit: "sec" });
        items.push({ label: "Confidence Score", value: (m.confidence_score * 100).toFixed(1), unit: "%" });
    }

    items.push({ label: "Pages Processed", value: m.pages_processed, unit: "pages" });
    items.push({ label: "Characters Processed", value: m.characters_processed.toLocaleString(), unit: "chars" });
    items.push({ label: "Words Processed", value: m.words_processed.toLocaleString(), unit: "words" });

    items.forEach(item => {
        grid.innerHTML += `
            <div class="metric-item">
                <div class="metric-label">${item.label}</div>
                <div class="metric-value">${item.value}<span class="metric-unit">${item.unit}</span></div>
            </div>`;
    });

    metricsContainer.style.display = "block";
}
</script>

</body>
</html>
