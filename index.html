<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocMind — Agentic Document Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #111118;
  --border: #1e1e2e;
  --accent: #7c6af7;
  --accent2: #4ade80;
  --accent3: #f59e0b;
  --text: #e2e8f0;
  --muted: #64748b;
  --card: #13131c;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Syne', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 30px 20px 60px;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(124,106,247,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(124,106,247,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

.header {
  text-align: center;
  margin-bottom: 40px;
}

.header h1 {
  font-size: 42px;
  font-weight: 800;
  background: linear-gradient(135deg, #7c6af7, #4ade80);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -1px;
}

.header p {
  color: var(--muted);
  font-size: 14px;
  margin-top: 8px;
  font-family: 'JetBrains Mono', monospace;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(124,106,247,0.1);
  border: 1px solid rgba(124,106,247,0.3);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--accent);
  margin-top: 12px;
}

.badge::before {
  content: '';
  width: 6px; height: 6px;
  background: var(--accent2);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 16px;
}

.card-title {
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 12px;
}

.upload-area {
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 30px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
}

.upload-area:hover, .upload-area.dragover {
  border-color: var(--accent);
  background: rgba(124,106,247,0.05);
}

.upload-area input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}

.upload-icon { font-size: 32px; margin-bottom: 8px; }
.upload-text { color: var(--muted); font-size: 14px; }
.upload-text span { color: var(--accent); }

.upload-status {
  margin-top: 12px;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
  display: none;
}

.upload-status.success {
  background: rgba(74,222,128,0.1);
  border: 1px solid rgba(74,222,128,0.3);
  color: var(--accent2);
  display: block;
}

.upload-status.error {
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.3);
  color: #ef4444;
  display: block;
}

.input-row {
  display: flex;
  gap: 12px;
  align-items: stretch;
}

.question-input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  color: var(--text);
  font-size: 15px;
  font-family: 'Syne', sans-serif;
  outline: none;
  transition: border-color 0.2s;
}

.question-input:focus { border-color: var(--accent); }
.question-input::placeholder { color: var(--muted); }

.submit-btn {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 10px;
  padding: 14px 28px;
  font-size: 14px;
  font-weight: 700;
  font-family: 'Syne', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.submit-btn:hover { background: #6b59e8; transform: translateY(-1px); }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

#agentPanel { display: none; margin-bottom: 16px; }

.agent-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.agent-title {
  font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--accent);
  font-weight: 700;
}

.agent-spinner {
  width: 14px; height: 14px;
  border: 2px solid rgba(124,106,247,0.3);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.timeline { display: flex; flex-direction: column; gap: 0; }

.timeline-item {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  opacity: 0;
  transform: translateY(10px);
  animation: slideIn 0.3s ease forwards;
}

@keyframes slideIn { to { opacity: 1; transform: translateY(0); } }

.timeline-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
  margin-top: 2px;
}

.timeline-line { position: relative; }

.timeline-line::after {
  content: '';
  position: absolute;
  left: 13px;
  top: 30px;
  bottom: -8px;
  width: 2px;
  background: var(--border);
}

.timeline-item:last-child .timeline-line::after { display: none; }

.timeline-content { flex: 1; padding-bottom: 16px; }

.timeline-label {
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 4px;
}

.timeline-message { font-size: 13px; color: var(--text); line-height: 1.5; }

.event-extract .timeline-dot { background: rgba(245,158,11,0.15); color: var(--accent3); }
.event-extract .timeline-label { color: var(--accent3); }
.event-workflow .timeline-dot { background: rgba(124,106,247,0.15); color: var(--accent); }
.event-workflow .timeline-label { color: var(--accent); }
.event-agent_start .timeline-dot { background: rgba(124,106,247,0.2); color: var(--accent); }
.event-agent_start .timeline-label { color: var(--accent); }
.event-agent_thought .timeline-dot { background: rgba(74,222,128,0.1); color: var(--accent2); }
.event-agent_thought .timeline-label { color: var(--accent2); }
.event-agent_search .timeline-dot { background: rgba(99,179,237,0.15); color: #63b3ed; }
.event-agent_search .timeline-label { color: #63b3ed; }
.event-agent_action .timeline-dot { background: rgba(245,158,11,0.15); color: var(--accent3); }
.event-agent_action .timeline-label { color: var(--accent3); }
.event-agent_done .timeline-dot { background: rgba(74,222,128,0.2); color: var(--accent2); }
.event-agent_done .timeline-label { color: var(--accent2); }

#answerPanel { display: none; }

.answer-box[data-streaming]::after {
  content: "▋";
  display: inline-block;
  animation: blink 0.7s infinite;
  color: var(--accent);
  margin-left: 2px;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

.answer-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px 28px;
  font-size: 15px;
  line-height: 1.8;
  white-space: pre-wrap;
  word-wrap: break-word;
  color: var(--text);
  min-height: 120px;
}

.metric-item.good .metric-value { color: var(--accent2); }
.metric-item.warn .metric-value { color: var(--accent3); }
.metric-item.bad  .metric-value { color: #ef4444; }

.metrics-section-title {
  grid-column: 1/-1;
  border-top: 1px solid var(--border);
  margin: 4px 0 6px;
  padding-top: 10px;
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

#metricsPanel { display: none; }

.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
  margin-top: 12px;
}

.metric-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
}

.metric-label {
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}

.metric-value {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
  font-family: 'JetBrains Mono', monospace;
}

.metric-unit {
  font-size: 11px;
  color: var(--muted);
  margin-left: 3px;
}

/* Decision badge styles */
.decision-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  letter-spacing: 0.05em;
}
.decision-accepted    { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
.decision-rejected    { background: rgba(239,68,68,0.15);  color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
.decision-hard-reject { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>DocMind</h1>
    <p>Agentic Document Intelligence System</p>
    <div class="badge">LangGraph · ReAct · FAISS · RAPTOR · RoBERTa · LLaMA 3.2</div>
  </div>

  <div class="card">
    <div class="card-title">01 — Upload Document</div>
    <div class="upload-area" id="uploadArea">
      <input type="file" id="pdfUpload" accept="application/pdf">
      <div class="upload-icon">📄</div>
      <div class="upload-text">Drop PDF here or <span>browse</span></div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;">
        Supports digital + scanned PDFs · Any size
      </div>
    </div>
    <div class="upload-status" id="uploadStatus"></div>
  </div>

  <div class="card">
    <div class="card-title">02 — Ask Question or Request Summary</div>
    <div class="input-row">
      <input type="text" class="question-input" id="questionInput"
        placeholder="e.g. 'give summary' or 'list all ethical theories' or 'why is AI dangerous?'">
      <button class="submit-btn" id="submitBtn" onclick="askQuestion()">
        Run Agent →
      </button>
    </div>
  </div>

  <div class="card" id="agentPanel">
    <div class="agent-header">
      <div class="agent-spinner" id="agentSpinner"></div>
      <div class="agent-title">AGENT REASONING TRACE</div>
    </div>
    <div class="timeline" id="timeline"></div>
  </div>

  <div class="card" id="answerPanel">
    <div class="card-title">Answer</div>
    <div class="answer-box" id="answerBox"></div>
  </div>

  <div class="card" id="metricsPanel">
    <div class="card-title">Benchmark Metrics</div>
    <div class="metrics-grid" id="metricsGrid"></div>
  </div>

</div>

<script>
let uploadedFileName = "";

function formatTime(seconds) {
  seconds = parseFloat(seconds);
  if (isNaN(seconds)) return "—";
  if (seconds < 60) return seconds.toFixed(2) + " sec";
  const mins = Math.floor(seconds / 60);
  const secs = (seconds % 60).toFixed(2);
  return mins + " min " + secs + " sec";
}

function generateId() {
  return Math.random().toString(36).substr(2, 9);
}

const uploadArea = document.getElementById("uploadArea");
uploadArea.addEventListener("dragover", e => { e.preventDefault(); uploadArea.classList.add("dragover"); });
uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("dragover"));
uploadArea.addEventListener("drop", e => {
  e.preventDefault();
  uploadArea.classList.remove("dragover");
  const file = e.dataTransfer.files[0];
  if (file) { document.getElementById("pdfUpload").files = e.dataTransfer.files; doUpload(file); }
});
document.getElementById("pdfUpload").addEventListener("change", e => {
  if (e.target.files[0]) doUpload(e.target.files[0]);
});

function doUpload(file) {
  const status = document.getElementById("uploadStatus");
  status.className = "upload-status";
  status.textContent = "⏳ Uploading...";
  status.style.display = "block";

  const formData = new FormData();
  formData.append("file", file);

  fetch("upload.php", { method: "POST", body: formData })
    .then(r => r.json())
    .then(data => {
      if (data.status === "success") {
        uploadedFileName = data.filename;
        status.className = "upload-status success";
        status.textContent = "✅ " + uploadedFileName;
        document.querySelector('.upload-icon').textContent = "📋";
      } else {
        status.className = "upload-status error";
        status.textContent = "❌ " + data.message;
      }
    })
    .catch(() => {
      status.className = "upload-status error";
      status.textContent = "❌ Upload failed";
    });
}

const EVENT_CONFIG = {
  extract_start:  { icon: "📄", label: "EXTRACTION" },
  workflow_start: { icon: "⚙️", label: "WORKFLOW" },
  agent_start:    { icon: "🤖", label: "AGENT INIT" },
  agent_thought:  { icon: "💭", label: "REASONING" },
  agent_search:   { icon: "🔍", label: "SEARCHING" },
  agent_action:   { icon: "⚡", label: "ACTION" },
  agent_done:     { icon: "✅", label: "COMPLETE" },
  stream_start:   { icon: "✍️", label: "STREAMING" },
  heartbeat:      null,
  done:           null,
  token:          null,
};

function addTimelineEvent(type, message) {
  const cfg = EVENT_CONFIG[type];
  if (!cfg) return;
  const timeline = document.getElementById("timeline");
  const item = document.createElement("div");
  item.className = `timeline-item timeline-line event-${type}`;
  item.innerHTML = `
    <div class="timeline-dot">${cfg.icon}</div>
    <div class="timeline-content">
      <div class="timeline-label">${cfg.label}</div>
      <div class="timeline-message">${message}</div>
    </div>`;
  timeline.appendChild(item);
  item.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function askQuestion() {
  const question = document.getElementById("questionInput").value.trim();
  if (!question) { alert("Please enter a question."); return; }
  if (!uploadedFileName) { alert("Please upload a PDF first."); return; }

  const requestId = generateId();
  const summaryKeywords = ["summary", "summarize", "overview", "brief", "outline", "gist", "tldr"];
  const isSummary = summaryKeywords.some(k => question.toLowerCase().includes(k));

  document.getElementById("agentPanel").style.display = isSummary ? "none" : "block";
  document.getElementById("answerPanel").style.display = "none";
  document.getElementById("metricsPanel").style.display = "none";
  document.getElementById("timeline").innerHTML = "";
  document.getElementById("agentSpinner").style.display = "block";
  document.getElementById("submitBtn").disabled = true;
  document.getElementById("submitBtn").textContent = "Processing...";

  let evtSource = null;

  if (!isSummary) {
    evtSource = new EventSource(`ask.php?stream=1&request_id=${requestId}`);
    document.getElementById("answerPanel").style.display = "block";
    document.getElementById("answerBox").textContent = "";
    document.getElementById("answerBox").setAttribute("data-streaming", "true");

    evtSource.onmessage = function(e) {
      const data = JSON.parse(e.data);
      if (data.type === "heartbeat") return;
      if (data.type === "done") {
        evtSource.close();
        document.getElementById("agentSpinner").style.display = "none";
        document.getElementById("answerBox").removeAttribute("data-streaming");
        return;
      }
      if (data.type === "stream_start") {
        document.getElementById("answerPanel").style.display = "block";
        document.getElementById("answerBox").setAttribute("data-streaming", "true");
        return;
      }
      if (data.type === "token") {
        const box = document.getElementById("answerBox");
        document.getElementById("answerPanel").style.display = "block";
        box.textContent += data.message;
        box.scrollTop = box.scrollHeight;
        return;
      }
      addTimelineEvent(data.type, data.message);
    };

    evtSource.onerror = function() { evtSource.close(); };

  } else {
    document.getElementById("agentPanel").style.display = "block";
    document.getElementById("timeline").innerHTML = "";
    addTimelineEvent("extract_start", "📄 Extracting PDF text...");
    addTimelineEvent("workflow_start", "⚙️ Running RAPTOR hierarchical summarization...");
  }

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 3600000);

  fetch("ask.php", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question, filename: uploadedFileName, request_id: requestId }),
    signal: controller.signal
  })
  .then(r => r.json())
  .then(data => {
    clearTimeout(timeout);
    if (evtSource) evtSource.close();
    document.getElementById("agentSpinner").style.display = "none";
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").textContent = "Run Agent →";

    const box = document.getElementById("answerBox");
    box.removeAttribute("data-streaming");
    document.getElementById("answerPanel").style.display = "block";
    box.textContent = data.answer || "No answer returned.";

    if (data.metrics) showMetrics(data.metrics);
  })
  .catch(err => {
    clearTimeout(timeout);
    if (evtSource) evtSource.close();
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").textContent = "Run Agent →";
    document.getElementById("answerPanel").style.display = "block";
    document.getElementById("answerBox").textContent =
      err.name === "AbortError" ? "Request timed out." : "Error: " + err.message;
  });
}

function scoreClass(val, goodThresh, warnThresh) {
  if (val >= goodThresh) return "good";
  if (val >= warnThresh) return "warn";
  return "bad";
}

function showMetrics(m) {
  const grid = document.getElementById("metricsGrid");
  grid.innerHTML = "";

  // ── Core Performance ──
  grid.innerHTML += `<div class="metrics-section-title">📊 Core Performance</div>`;
  const core = [
    { label: "Type",       value: m.type === "summary" ? "Summary" : "Q&A", unit: "" },
    { label: "Total Time", value: formatTime(m.response_time_sec),           unit: "" },
    { label: "Extraction", value: formatTime(m.extraction_time_sec),         unit: "" },
  ];
  if (m.type === "summary") {
    core.push({ label: "Summary Time",   value: formatTime(m.summary_time_sec),               unit: "" });
    core.push({ label: "Summary Length", value: (m.summary_length_words||0).toLocaleString(), unit: "words" });
    core.push({ label: "LLM Calls",      value: m.llm_calls || "—",                           unit: "calls" });
  } else {
    core.push({ label: "QA Time",   value: formatTime(m.qa_time_sec), unit: "" });
    core.push({ label: "Model",     value: m.model_used || "—",       unit: "" });
    core.push({ label: "LLM Calls", value: m.llm_calls ?? "—",        unit: "calls" });
  }
  core.push({ label: "Pages",      value: m.pages_processed,                            unit: "pages" });
  core.push({ label: "Characters", value: (m.characters_processed||0).toLocaleString(), unit: "chars" });
  core.push({ label: "Words",      value: (m.words_processed||0).toLocaleString(),      unit: "words" });
  core.forEach(item => {
    grid.innerHTML += `<div class="metric-item"><div class="metric-label">${item.label}</div><div class="metric-value">${item.value}<span class="metric-unit"> ${item.unit}</span></div></div>`;
  });

  // ── Latency Metrics ──
  grid.innerHTML += `<div class="metrics-section-title">⚡ Latency Metrics</div>`;
  const ttft = parseFloat(m.ttft_sec || m.response_time_sec || 0);
  const e2e  = parseFloat(m.e2e_latency_sec || m.response_time_sec || 0);
  const tps  = parseFloat(m.tps || 0);
  [
    { label: "TTFT", sub: "Time To First Token", value: formatTime(ttft),
      note: ttft < e2e ? "✅ Streaming active!" : "= E2E (no streaming yet)",
      cls: ttft < e2e ? "good" : "warn" },
    { label: "E2E Latency", sub: "End To End", value: formatTime(e2e),
      note: "total response time", cls: "warn" },
    { label: "TPS", sub: "Tokens/Second", value: tps.toFixed(1),
      note: tps >= 5 ? "✅ Fast" : tps >= 2 ? "⚠️ Medium" : "❌ Slow",
      cls: tps >= 5 ? "good" : tps >= 2 ? "warn" : "bad" },
  ].forEach(item => {
    grid.innerHTML += `<div class="metric-item ${item.cls}"><div class="metric-label">${item.label} <span style="color:var(--muted);font-weight:400">· ${item.sub}</span></div><div class="metric-value">${item.value}</div><div style="font-size:10px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;">${item.note}</div></div>`;
  });

  // ── RAG Quality Metrics ──
  if (m.type !== "summary") {
    grid.innerHTML += `<div class="metrics-section-title">🎯 RAG Quality Metrics</div>`;
    const retrieval = parseFloat(m.retrieval_score || 0);
    const conf      = parseFloat(m.confidence_score || 0);
    const recallAtK = parseFloat(m.recall_at_k || 0);

    [
      {
        label: "Retrieval Score", sub: "Chunk Relevance",
        value: retrieval.toFixed(1) + "%",
        note:  retrieval >= 40 ? "✅ Good" : "⚠️ Low",
        cls:   scoreClass(retrieval, 40, 25)
      },
      {
        label: "Confidence", sub: "Retrieval + Verified",
        value: conf.toFixed(1) + "%",
        note:  conf >= 60 ? "✅ High" : conf >= 30 ? "⚠️ Medium" : "❌ Low",
        cls:   scoreClass(conf, 60, 30)
      },
      {
        label: "Recall@K", sub: "Oracle Chunk Hit",
        value: recallAtK.toFixed(1) + "%",
        note:  recallAtK === 100  ? "✅ Oracle retrieved" :
               recallAtK >= 70   ? "✅ Very close" :
               recallAtK >= 40   ? "⚠️ Partial" : "❌ Missed",
        cls:   scoreClass(recallAtK, 70, 40)
      },
    ].forEach(item => {
      grid.innerHTML += `<div class="metric-item ${item.cls}">
        <div class="metric-label">${item.label} <span style="color:var(--muted);font-weight:400">· ${item.sub}</span></div>
        <div class="metric-value">${item.value}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;">${item.note}</div>
      </div>`;
    });

    // ── Decision Intelligence (NEW) ──
    grid.innerHTML += `<div class="metrics-section-title">🧠 Decision Intelligence</div>`;

    // Decision Type badge
    const dt = m.decision_type || "accepted";
    const dtLabel = dt === "accepted"                  ? "✅ Accepted"
                  : dt === "rejected_verification"     ? "❌ Rejected · Verification"
                  : dt === "rejected_low_retrieval"    ? "🚫 Rejected · Low Retrieval"
                  : dt === "hard_reject"               ? "🚫 Hard Reject"
                  : dt;
    const dtCls = dt === "accepted" ? "decision-accepted" : "decision-rejected";
    grid.innerHTML += `<div class="metric-item" style="grid-column: 1/-1; background: var(--surface);">
      <div class="metric-label">Decision Type</div>
      <div style="margin-top:6px;"><span class="decision-badge ${dtCls}">${dtLabel}</span></div>
    </div>`;

    // Verification Mode + Keyword Score + Verified
    const vm       = m.verification_mode || "none";
    const kwScore  = parseFloat(m.keyword_score || 0);
    const verified = m.verified === true;

    [
      {
        label: "Verification Mode", sub: "Strictness",
        value: vm === "strict" ? "STRICT" : vm === "normal" ? "NORMAL" : "NONE",
        note:  vm === "strict" ? "⚠️ Weak retrieval" : vm === "normal" ? "✅ Standard" : "— Not applied",
        cls:   vm === "strict" ? "warn" : vm === "normal" ? "good" : ""
      },
      {
        label: "Keyword Score", sub: "Answer Grounding",
        value: kwScore.toFixed(1) + "%",
        note:  kwScore >= 80 ? "✅ Strong" : kwScore >= 60 ? "✅ Good" : kwScore >= 30 ? "⚠️ Weak" : "❌ Low",
        cls:   scoreClass(kwScore, 60, 30)
      },
      {
        label: "Verified", sub: "Answer Confirmed",
        value: verified ? "YES" : "NO",
        note:  verified ? "✅ Answer verified" : "❌ Not verified",
        cls:   verified ? "good" : "bad"
      },
    ].forEach(item => {
      grid.innerHTML += `<div class="metric-item ${item.cls}">
        <div class="metric-label">${item.label} <span style="color:var(--muted);font-weight:400">· ${item.sub}</span></div>
        <div class="metric-value">${item.value}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;">${item.note}</div>
      </div>`;
    });

    // ── Debug Metrics (display only) ──
    grid.innerHTML += `<div class="metrics-section-title">🔬 Debug Metrics · For Analysis Only</div>`;
    const precision = parseFloat(m.context_precision || 0);
    const grounding = parseFloat(m.answer_grounding  || 0);
    [
      {
        label: "Context Precision", sub: "Relevant/Retrieved",
        value: precision.toFixed(1) + "%",
        note:  "Debug only — not used in decisions",
        cls:   ""
      },
      {
        label: "Answer Grounding", sub: "Word Overlap",
        value: grounding.toFixed(1) + "%",
        note:  "Debug only — not used in decisions",
        cls:   ""
      },
    ].forEach(item => {
      grid.innerHTML += `<div class="metric-item" style="opacity:0.6;">
        <div class="metric-label">${item.label} <span style="color:var(--muted);font-weight:400">· ${item.sub}</span></div>
        <div class="metric-value" style="font-size:16px;">${item.value}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;">${item.note}</div>
      </div>`;
    });
  }

  document.getElementById("metricsPanel").style.display = "block";
}

document.getElementById("questionInput").addEventListener("keydown", e => {
  if (e.key === "Enter") askQuestion();
});
</script>

<script>
let uploadedFileName = "";

function formatTime(seconds) {
  seconds = parseFloat(seconds);
  if (isNaN(seconds)) return "—";
  if (seconds < 60) return seconds.toFixed(2) + " sec";
  const mins = Math.floor(seconds / 60);
  const secs = (seconds % 60).toFixed(2);
  return mins + " min " + secs + " sec";
}

function generateId() {
  return Math.random().toString(36).substr(2, 9);
}

const uploadArea = document.getElementById("uploadArea");
uploadArea.addEventListener("dragover", e => { e.preventDefault(); uploadArea.classList.add("dragover"); });
uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("dragover"));
uploadArea.addEventListener("drop", e => {
  e.preventDefault();
  uploadArea.classList.remove("dragover");
  const file = e.dataTransfer.files[0];
  if (file) { document.getElementById("pdfUpload").files = e.dataTransfer.files; doUpload(file); }
});
document.getElementById("pdfUpload").addEventListener("change", e => {
  if (e.target.files[0]) doUpload(e.target.files[0]);
});

function doUpload(file) {
  const status = document.getElementById("uploadStatus");
  status.className = "upload-status";
  status.textContent = "⏳ Uploading...";
  status.style.display = "block";

  const formData = new FormData();
  formData.append("file", file);

  fetch("upload.php", { method: "POST", body: formData })
    .then(r => r.json())
    .then(data => {
      if (data.status === "success") {
        uploadedFileName = data.filename;
        status.className = "upload-status success";
        status.textContent = "✅ " + uploadedFileName;
        document.querySelector('.upload-icon').textContent = "📋";
      } else {
        status.className = "upload-status error";
        status.textContent = "❌ " + data.message;
      }
    })
    .catch(() => {
      status.className = "upload-status error";
      status.textContent = "❌ Upload failed";
    });
}

const EVENT_CONFIG = {
  extract_start:  { icon: "📄", label: "EXTRACTION" },
  workflow_start: { icon: "⚙️", label: "WORKFLOW" },
  agent_start:    { icon: "🤖", label: "AGENT INIT" },
  agent_thought:  { icon: "💭", label: "REASONING" },
  agent_search:   { icon: "🔍", label: "SEARCHING" },
  agent_action:   { icon: "⚡", label: "ACTION" },
  agent_done:     { icon: "✅", label: "COMPLETE" },
  stream_start:   { icon: "✍️", label: "STREAMING" },
  heartbeat:      null,
  done:           null,
  token:          null,
};

function addTimelineEvent(type, message) {
  const cfg = EVENT_CONFIG[type];
  if (!cfg) return;
  const timeline = document.getElementById("timeline");
  const item = document.createElement("div");
  item.className = `timeline-item timeline-line event-${type}`;
  item.innerHTML = `
    <div class="timeline-dot">${cfg.icon}</div>
    <div class="timeline-content">
      <div class="timeline-label">${cfg.label}</div>
      <div class="timeline-message">${message}</div>
    </div>`;
  timeline.appendChild(item);
  item.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function askQuestion() {
  const question = document.getElementById("questionInput").value.trim();
  if (!question) { alert("Please enter a question."); return; }
  if (!uploadedFileName) { alert("Please upload a PDF first."); return; }

  const requestId = generateId();
  const summaryKeywords = ["summary", "summarize", "overview", "brief", "outline", "gist", "tldr"];
  const isSummary = summaryKeywords.some(k => question.toLowerCase().includes(k));

  document.getElementById("agentPanel").style.display = isSummary ? "none" : "block";
  document.getElementById("answerPanel").style.display = "none";
  document.getElementById("metricsPanel").style.display = "none";
  document.getElementById("timeline").innerHTML = "";
  document.getElementById("agentSpinner").style.display = "block";
  document.getElementById("submitBtn").disabled = true;
  document.getElementById("submitBtn").textContent = "Processing...";

  let evtSource = null;

  if (!isSummary) {
    evtSource = new EventSource(`ask.php?stream=1&request_id=${requestId}`);
    document.getElementById("answerPanel").style.display = "block";
    document.getElementById("answerBox").textContent = "";
    document.getElementById("answerBox").setAttribute("data-streaming", "true");

    evtSource.onmessage = function(e) {
      const data = JSON.parse(e.data);
      if (data.type === "heartbeat") return;
      if (data.type === "done") {
        evtSource.close();
        document.getElementById("agentSpinner").style.display = "none";
        document.getElementById("answerBox").removeAttribute("data-streaming");
        return;
      }
      if (data.type === "stream_start") {
        document.getElementById("answerPanel").style.display = "block";
        document.getElementById("answerBox").setAttribute("data-streaming", "true");
        return;
      }
      if (data.type === "token") {
        const box = document.getElementById("answerBox");
        document.getElementById("answerPanel").style.display = "block";
        box.textContent += data.message;
        box.scrollTop = box.scrollHeight;
        return;
      }
      addTimelineEvent(data.type, data.message);
    };

    evtSource.onerror = function() { evtSource.close(); };

  } else {
    document.getElementById("agentPanel").style.display = "block";
    document.getElementById("timeline").innerHTML = "";
    addTimelineEvent("extract_start", "📄 Extracting PDF text...");
    addTimelineEvent("workflow_start", "⚙️ Running RAPTOR hierarchical summarization...");
  }

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 3600000);

  fetch("ask.php", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question, filename: uploadedFileName, request_id: requestId }),
    signal: controller.signal
  })
  .then(r => r.json())
  .then(data => {
    clearTimeout(timeout);
    if (evtSource) evtSource.close();
    document.getElementById("agentSpinner").style.display = "none";
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").textContent = "Run Agent →";

    const box = document.getElementById("answerBox");
    box.removeAttribute("data-streaming");
    document.getElementById("answerPanel").style.display = "block";
    box.textContent = data.answer || "No answer returned.";

    if (data.metrics) showMetrics(data.metrics);
  })
  .catch(err => {
    clearTimeout(timeout);
    if (evtSource) evtSource.close();
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").textContent = "Run Agent →";
    document.getElementById("answerPanel").style.display = "block";
    document.getElementById("answerBox").textContent =
      err.name === "AbortError" ? "Request timed out." : "Error: " + err.message;
  });
}

function scoreClass(val, goodThresh, warnThresh) {
  if (val >= goodThresh) return "good";
  if (val >= warnThresh) return "warn";
  return "bad";
}

function showMetrics(m) {
  const grid = document.getElementById("metricsGrid");
  grid.innerHTML = "";

  // ── Core Performance ──
  grid.innerHTML += `<div class="metrics-section-title">📊 Core Performance</div>`;
  const core = [
    { label: "Type",       value: m.type === "summary" ? "Summary" : "Q&A", unit: "" },
    { label: "Total Time", value: formatTime(m.response_time_sec),           unit: "" },
    { label: "Extraction", value: formatTime(m.extraction_time_sec),         unit: "" },
  ];
  if (m.type === "summary") {
    core.push({ label: "Summary Time",   value: formatTime(m.summary_time_sec),               unit: "" });
    core.push({ label: "Summary Length", value: (m.summary_length_words||0).toLocaleString(), unit: "words" });
    core.push({ label: "LLM Calls",      value: m.llm_calls || "—",                           unit: "calls" });
  } else {
    core.push({ label: "QA Time",   value: formatTime(m.qa_time_sec), unit: "" });
    core.push({ label: "Model",     value: m.model_used || "—",       unit: "" });
    core.push({ label: "LLM Calls", value: m.llm_calls ?? "—",        unit: "calls" });
  }
  core.push({ label: "Pages",      value: m.pages_processed,                            unit: "pages" });
  core.push({ label: "Characters", value: (m.characters_processed||0).toLocaleString(), unit: "chars" });
  core.push({ label: "Words",      value: (m.words_processed||0).toLocaleString(),      unit: "words" });
  core.forEach(item => {
    grid.innerHTML += `<div class="metric-item"><div class="metric-label">${item.label}</div><div class="metric-value">${item.value}<span class="metric-unit"> ${item.unit}</span></div></div>`;
  });

  // ── Latency Metrics ──
  grid.innerHTML += `<div class="metrics-section-title">⚡ Latency Metrics</div>`;
  const ttft = parseFloat(m.ttft_sec || m.response_time_sec || 0);
  const e2e  = parseFloat(m.e2e_latency_sec || m.response_time_sec || 0);
  const tps  = parseFloat(m.tps || 0);
  [
    { label: "TTFT", sub: "Time To First Token", value: formatTime(ttft),
      note: ttft < e2e ? "✅ Streaming active!" : "= E2E (no streaming yet)",
      cls: ttft < e2e ? "good" : "warn" },
    { label: "E2E Latency", sub: "End To End", value: formatTime(e2e),
      note: "total response time", cls: "warn" },
    { label: "TPS", sub: "Tokens/Second", value: tps.toFixed(1),
      note: tps >= 5 ? "✅ Fast" : tps >= 2 ? "⚠️ Medium" : "❌ Slow",
      cls: tps >= 5 ? "good" : tps >= 2 ? "warn" : "bad" },
  ].forEach(item => {
    grid.innerHTML += `<div class="metric-item ${item.cls}"><div class="metric-label">${item.label} <span style="color:var(--muted);font-weight:400">· ${item.sub}</span></div><div class="metric-value">${item.value}</div><div style="font-size:10px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;">${item.note}</div></div>`;
  });

  // ── RAG Quality Metrics ──
  if (m.type !== "summary") {
    grid.innerHTML += `<div class="metrics-section-title">🎯 RAG Quality Metrics</div>`;
    const retrieval = parseFloat(m.retrieval_score || 0);
    const conf      = parseFloat(m.confidence_score || 0);
    const recallAtK = parseFloat(m.recall_at_k || 0);

    [
      {
        label: "Retrieval Score", sub: "Chunk Relevance",
        value: retrieval.toFixed(1) + "%",
        note:  retrieval >= 40 ? "✅ Good" : "⚠️ Low",
        cls:   scoreClass(retrieval, 40, 25)
      },
      {
        label: "Confidence", sub: "Retrieval + Verified",
        value: conf.toFixed(1) + "%",
        note:  conf >= 60 ? "✅ High" : conf >= 30 ? "⚠️ Medium" : "❌ Low",
        cls:   scoreClass(conf, 60, 30)
      },
      {
        label: "Recall@K", sub: "Oracle Chunk Hit",
        value: recallAtK.toFixed(1) + "%",
        note:  recallAtK === 100  ? "✅ Oracle retrieved" :
               recallAtK >= 70   ? "✅ Very close" :
               recallAtK >= 40   ? "⚠️ Partial" : "❌ Missed",
        cls:   scoreClass(recallAtK, 70, 40)
      },
    ].forEach(item => {
      grid.innerHTML += `<div class="metric-item ${item.cls}">
        <div class="metric-label">${item.label} <span style="color:var(--muted);font-weight:400">· ${item.sub}</span></div>
        <div class="metric-value">${item.value}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;">${item.note}</div>
      </div>`;
    });

    // ── Decision Intelligence (NEW) ──
    grid.innerHTML += `<div class="metrics-section-title">🧠 Decision Intelligence</div>`;

    // Decision Type badge
    const dt = m.decision_type || "accepted";
    const dtLabel = dt === "accepted"                  ? "✅ Accepted"
                  : dt === "rejected_verification"     ? "❌ Rejected · Verification"
                  : dt === "rejected_low_retrieval"    ? "🚫 Rejected · Low Retrieval"
                  : dt === "hard_reject"               ? "🚫 Hard Reject"
                  : dt;
    const dtCls = dt === "accepted" ? "decision-accepted" : "decision-rejected";
    grid.innerHTML += `<div class="metric-item" style="grid-column: 1/-1; background: var(--surface);">
      <div class="metric-label">Decision Type</div>
      <div style="margin-top:6px;"><span class="decision-badge ${dtCls}">${dtLabel}</span></div>
    </div>`;

    // Verification Mode + Keyword Score + Verified
    const vm       = m.verification_mode || "none";
    const kwScore  = parseFloat(m.keyword_score || 0);
    const verified = m.verified === true;

    [
      {
        label: "Verification Mode", sub: "Strictness",
        value: vm === "strict" ? "STRICT" : vm === "normal" ? "NORMAL" : "NONE",
        note:  vm === "strict" ? "⚠️ Weak retrieval" : vm === "normal" ? "✅ Standard" : "— Not applied",
        cls:   vm === "strict" ? "warn" : vm === "normal" ? "good" : ""
      },
      {
        label: "Keyword Score", sub: "Answer Grounding",
        value: kwScore.toFixed(1) + "%",
        note:  kwScore >= 80 ? "✅ Strong" : kwScore >= 60 ? "✅ Good" : kwScore >= 30 ? "⚠️ Weak" : "❌ Low",
        cls:   scoreClass(kwScore, 60, 30)

    ].forEach(item => {
      grid.innerHTML += `<div class="metric-item ${item.cls}">
        <div class="metric-label">${item.label} <span style="color:var(--muted);font-weight:400">· ${item.sub}</span></div>

    // ── Debug Metrics (display only) ──
    grid.innerHTML += `<div class="metrics-section-title">🔬 Debug Metrics · For Analysis Only</div>`;
    const precision = parseFloat(m.context_precision || 0);

    [
      {
        label: "Context Precision", sub: "Relevant/Retrieved",
        value: precision.toFixed(1) + "%",
        note:  "Debug only — not used in decisions",

      {

        note:  "Debug only — not used in decisions",
        cls:   ""
      },
    ].forEach(item => {
      grid.innerHTML += `<div class="metric-item" style="opacity:0.6;">

  }

  document.getElementById("metricsPanel").style.display = "block";
}

<script>
let uploadedFileName = "";

function formatTime(seconds) {
  seconds = parseFloat(seconds);
  if (isNaN(seconds)) return "—";
  if (seconds < 60) return seconds.toFixed(2) + " sec";
  const mins = Math.floor(seconds / 60);
  const secs = (seconds % 60).toFixed(2);
  return mins + " min " + secs + " sec";
}

function generateId() {
  return Math.random().toString(36).substr(2, 9);
}

const uploadArea = document.getElementById("uploadArea");
uploadArea.addEventListener("dragover", e => { e.preventDefault(); uploadArea.classList.add("dragover"); });
uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("dragover"));
uploadArea.addEventListener("drop", e => {
  e.preventDefault();
  uploadArea.classList.remove("dragover");
  const file = e.dataTransfer.files[0];
  if (file) { document.getElementById("pdfUpload").files = e.dataTransfer.files; doUpload(file); }
});
document.getElementById("pdfUpload").addEventListener("change", e => {
  if (e.target.files[0]) doUpload(e.target.files[0]);
});

function doUpload(file) {
  const status = document.getElementById("uploadStatus");
  status.className = "upload-status";
  status.textContent = "⏳ Uploading...";
  status.style.display = "block";

  const formData = new FormData();
  formData.append("file", file);

  fetch("upload.php", { method: "POST", body: formData })
    .then(r => r.json())
    .then(data => {
      if (data.status === "success") {
        uploadedFileName = data.filename;
        status.className = "upload-status success";
        status.textContent = "✅ " + uploadedFileName;
        document.querySelector('.upload-icon').textContent = "📋";
      } else {
        status.className = "upload-status error";
        status.textContent = "❌ " + data.message;
      }
    })
    .catch(() => {
      status.className = "upload-status error";
      status.textContent = "❌ Upload failed";
    });
}

const EVENT_CONFIG = {
  extract_start:  { icon: "📄", label: "EXTRACTION" },
  workflow_start: { icon: "⚙️", label: "WORKFLOW" },
  agent_start:    { icon: "🤖", label: "AGENT INIT" },
  agent_thought:  { icon: "💭", label: "REASONING" },
  agent_search:   { icon: "🔍", label: "SEARCHING" },
  agent_action:   { icon: "⚡", label: "ACTION" },
  agent_done:     { icon: "✅", label: "COMPLETE" },
  stream_start:   { icon: "✍️", label: "STREAMING" },
  heartbeat:      null,
  done:           null,
  token:          null,
};

function addTimelineEvent(type, message) {
  const cfg = EVENT_CONFIG[type];
  if (!cfg) return;
  const timeline = document.getElementById("timeline");
  const item = document.createElement("div");
  item.className = `timeline-item timeline-line event-${type}`;
  item.innerHTML = `
    <div class="timeline-dot">${cfg.icon}</div>
    <div class="timeline-content">
      <div class="timeline-label">${cfg.label}</div>
      <div class="timeline-message">${message}</div>
    </div>`;
  timeline.appendChild(item);
  item.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function askQuestion() {
  const question = document.getElementById("questionInput").value.trim();
  if (!question) { alert("Please enter a question."); return; }
  if (!uploadedFileName) { alert("Please upload a PDF first."); return; }

  const requestId = generateId();
  const summaryKeywords = ["summary", "summarize", "overview", "brief", "outline", "gist", "tldr"];
  const isSummary = summaryKeywords.some(k => question.toLowerCase().includes(k));

  document.getElementById("agentPanel").style.display = isSummary ? "none" : "block";
  document.getElementById("answerPanel").style.display = "none";
  document.getElementById("metricsPanel").style.display = "none";
  document.getElementById("timeline").innerHTML = "";
  document.getElementById("agentSpinner").style.display = "block";
  document.getElementById("submitBtn").disabled = true;
  document.getElementById("submitBtn").textContent = "Processing...";

  // Track whether SSE has already streamed a real answer into the box
  let sseAnswerReceived = false;

  let evtSource = null;

  if (!isSummary) {
    evtSource = new EventSource(`ask.php?stream=1&request_id=${requestId}`);
    document.getElementById("answerPanel").style.display = "block";
    document.getElementById("answerBox").textContent = "";
    document.getElementById("answerBox").setAttribute("data-streaming", "true");

    evtSource.onmessage = function(e) {
      const data = JSON.parse(e.data);
      if (data.type === "heartbeat") return;
      if (data.type === "done") {
        evtSource.close();
        document.getElementById("agentSpinner").style.display = "none";
        document.getElementById("answerBox").removeAttribute("data-streaming");
        return;
      }
      if (data.type === "stream_start") {
        document.getElementById("answerPanel").style.display = "block";
        document.getElementById("answerBox").setAttribute("data-streaming", "true");
        return;
      }
      if (data.type === "token") {
        const box = document.getElementById("answerBox");
        document.getElementById("answerPanel").style.display = "block";
        box.textContent += data.message;
        box.scrollTop = box.scrollHeight;
        // Mark that we received real streamed content
        if (data.message && data.message.trim()) {
          sseAnswerReceived = true;
        }
        return;
      }
      addTimelineEvent(data.type, data.message);
    };

    evtSource.onerror = function() { evtSource.close(); };

  } else {
    document.getElementById("agentPanel").style.display = "block";
    document.getElementById("timeline").innerHTML = "";
    addTimelineEvent("extract_start", "📄 Extracting PDF text...");
    addTimelineEvent("workflow_start", "⚙️ Running RAPTOR hierarchical summarization...");
  }

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 3600000);

  fetch("ask.php", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question, filename: uploadedFileName, request_id: requestId }),
    signal: controller.signal
  })
  .then(r => r.json())
  .then(data => {
    clearTimeout(timeout);
    if (evtSource) evtSource.close();
    document.getElementById("agentSpinner").style.display = "none";
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").textContent = "Run Agent →";

    const box = document.getElementById("answerBox");
    box.removeAttribute("data-streaming");
    document.getElementById("answerPanel").style.display = "block";

    // ALWAYS use the JSON answer as the source of truth.
    // SSE tokens are only for live streaming UX feedback.
    // The final verified answer always comes from the JSON response.
    box.textContent = data.answer || "No answer returned.";

    if (data.metrics) showMetrics(data.metrics);
  })
  .catch(err => {
    clearTimeout(timeout);
    if (evtSource) evtSource.close();
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").textContent = "Run Agent →";
    document.getElementById("answerPanel").style.display = "block";
    document.getElementById("answerBox").textContent =
      err.name === "AbortError" ? "Request timed out." : "Error: " + err.message;
  });
}

function scoreClass(val, goodThresh, warnThresh) {
  if (val >= goodThresh) return "good";
  if (val >= warnThresh) return "warn";
  return "bad";
}

function showMetrics(m) {
  const grid = document.getElementById("metricsGrid");
  grid.innerHTML = "";

  // ── Core Performance ──
  grid.innerHTML += `<div class="metrics-section-title">📊 Core Performance</div>`;
  const core = [
    { label: "Type",       value: m.type === "summary" ? "Summary" : "Q&A", unit: "" },
    { label: "Total Time", value: formatTime(m.response_time_sec),           unit: "" },
    { label: "Extraction", value: formatTime(m.extraction_time_sec),         unit: "" },
  ];
  if (m.type === "summary") {
    core.push({ label: "Summary Time",   value: formatTime(m.summary_time_sec),               unit: "" });
    core.push({ label: "Summary Length", value: (m.summary_length_words||0).toLocaleString(), unit: "words" });
    core.push({ label: "LLM Calls",      value: m.llm_calls || "—",                           unit: "calls" });
  } else {
    core.push({ label: "QA Time",   value: formatTime(m.qa_time_sec), unit: "" });
    core.push({ label: "Model",     value: m.model_used || "—",       unit: "" });
    core.push({ label: "LLM Calls", value: m.llm_calls ?? "—",        unit: "calls" });
  }
  core.push({ label: "Pages",      value: m.pages_processed,                            unit: "pages" });
  core.push({ label: "Characters", value: (m.characters_processed||0).toLocaleString(), unit: "chars" });
  core.push({ label: "Words",      value: (m.words_processed||0).toLocaleString(),      unit: "words" });
  core.forEach(item => {
    grid.innerHTML += `<div class="metric-item"><div class="metric-label">${item.label}</div><div class="metric-value">${item.value}<span class="metric-unit"> ${item.unit}</span></div></div>`;
  });

  // ── Latency Metrics ──
  grid.innerHTML += `<div class="metrics-section-title">⚡ Latency Metrics</div>`;
  const ttft = parseFloat(m.ttft_sec || m.response_time_sec || 0);
  const e2e  = parseFloat(m.e2e_latency_sec || m.response_time_sec || 0);
  const tps  = parseFloat(m.tps || 0);
  [
    { label: "TTFT", sub: "Time To First Token", value: formatTime(ttft),
      note: ttft < e2e ? "✅ Streaming active!" : "= E2E (no streaming yet)",
      cls: ttft < e2e ? "good" : "warn" },
    { label: "E2E Latency", sub: "End To End", value: formatTime(e2e),
      note: "total response time", cls: "warn" },
    { label: "TPS", sub: "Tokens/Second", value: tps.toFixed(1),
      note: tps >= 5 ? "✅ Fast" : tps >= 2 ? "⚠️ Medium" : "❌ Slow",
      cls: tps >= 5 ? "good" : tps >= 2 ? "warn" : "bad" },
  ].forEach(item => {
    grid.innerHTML += `<div class="metric-item ${item.cls}"><div class="metric-label">${item.label} <span style="color:var(--muted);font-weight:400">· ${item.sub}</span></div><div class="metric-value">${item.value}</div><div style="font-size:10px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;">${item.note}</div></div>`;
  });

  // ── RAG Quality Metrics ──
  if (m.type !== "summary") {
    grid.innerHTML += `<div class="metrics-section-title">🎯 RAG Quality Metrics</div>`;
    const retrieval  = parseFloat(m.retrieval_score   || 0);
    const precision  = parseFloat(m.context_precision || 0);
    const grounding  = parseFloat(m.answer_grounding  || 0);
    const conf       = parseFloat((m.confidence_score || 0) * 100);
    const recallAtK  = parseFloat(m.recall_at_k       || 0);

    [
      {
        label: "Retrieval Score", sub: "Chunk Relevance",
        value: retrieval.toFixed(1) + "%",
        note:  retrieval >= 40 ? "✅ Good" : "⚠️ Low",
        cls:   scoreClass(retrieval, 40, 25)
      },
      {
        label: "Context Precision", sub: "Relevant/Retrieved",
        value: precision.toFixed(1) + "%",
        note:  precision >= 60 ? "✅ Precise" : "⚠️ Noisy",
        cls:   scoreClass(precision, 60, 40)
      },
      {
        label: "Answer Grounding", sub: "Grounded in Doc",
        value: grounding.toFixed(1) + "%",
        note:  grounding >= 50 ? "✅ Grounded" : "⚠️ Hallucination risk",
        cls:   scoreClass(grounding, 50, 30)
      },
      {
        label: "Confidence", sub: "Model Certainty",
        value: conf.toFixed(1) + "%",
        note:  conf >= 30 ? "✅ Confident" : "⚠️ Uncertain",
        cls:   scoreClass(conf, 30, 15)
      },
      {
        label: "Recall@K", sub: "Oracle Chunk Hit",
        value: recallAtK.toFixed(1) + "%",
        note:  recallAtK === 100  ? "✅ Oracle retrieved" :
               recallAtK >= 70   ? "✅ Very close to oracle" :
               recallAtK >= 40   ? "⚠️ Partial coverage" : "❌ Missed key chunk",
        cls:   scoreClass(recallAtK, 70, 40)
      },
    ].forEach(item => {
      grid.innerHTML += `<div class="metric-item ${item.cls}">
        <div class="metric-label">${item.label} <span style="color:var(--muted);font-weight:400">· ${item.sub}</span></div>
        <div class="metric-value">${item.value}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;">${item.note}</div>
      </div>`;
    });
  }

  document.getElementById("metricsPanel").style.display = "block";
}

document.getElementById("questionInput").addEventListener("keydown", e => {
  if (e.key === "Enter") askQuestion();
});
</script>

  const mins = Math.floor(seconds / 60);

uploadArea.addEventListener("drop", e => {
  e.preventDefault();
  uploadArea.classList.remove("dragover");
  const file = e.dataTransfer.files[0];
  if (file) { document.getElementById("pdfUpload").files = e.dataTransfer.files; doUpload(file); }
});
document.getElementById("pdfUpload").addEventListener("change", e => {
  if (e.target.files[0]) doUpload(e.target.files[0]);
});

function doUpload(file) {
  const status = document.getElementById("uploadStatus");
  status.className = "upload-status";
  status.textContent = "⏳ Uploading...";
  status.style.display = "block";

  const formData = new FormData();
  formData.append("file", file);

  fetch("upload.php", { method: "POST", body: formData })
    .then(r => r.json())
    .then(data => {
      if (data.status === "success") {
        uploadedFileName = data.filename;
        status.className = "upload-status success";
        status.textContent = "✅ " + uploadedFileName;
        document.querySelector('.upload-icon').textContent = "📋";
      } else {
        status.className = "upload-status error";
        status.textContent = "❌ " + data.message;
      }
    })
    .catch(() => {
      status.className = "upload-status error";
      status.textContent = "❌ Upload failed";
    });
}

const EVENT_CONFIG = {
  extract_start:  { icon: "📄", label: "EXTRACTION" },
  workflow_start: { icon: "⚙️", label: "WORKFLOW" },
  agent_start:    { icon: "🤖", label: "AGENT INIT" },
  agent_thought:  { icon: "💭", label: "REASONING" },
  agent_search:   { icon: "🔍", label: "SEARCHING" },
  agent_action:   { icon: "⚡", label: "ACTION" },
  agent_done:     { icon: "✅", label: "COMPLETE" },
  stream_start:   { icon: "✍️", label: "STREAMING" },
  heartbeat:      null,
  done:           null,
  token:          null,
};

function addTimelineEvent(type, message) {
  const cfg = EVENT_CONFIG[type];
  if (!cfg) return;
  const timeline = document.getElementById("timeline");
  const item = document.createElement("div");
  item.className = `timeline-item timeline-line event-${type}`;
  item.innerHTML = `
    <div class="timeline-dot">${cfg.icon}</div>
    <div class="timeline-content">
      <div class="timeline-label">${cfg.label}</div>
      <div class="timeline-message">${message}</div>
    </div>`;
  timeline.appendChild(item);
  item.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function askQuestion() {
  const question = document.getElementById("questionInput").value.trim();
  if (!question) { alert("Please enter a question."); return; }
  if (!uploadedFileName) { alert("Please upload a PDF first."); return; }

  const requestId = generateId();
  const summaryKeywords = ["summary", "summarize", "overview", "brief", "outline", "gist", "tldr"];
  const isSummary = summaryKeywords.some(k => question.toLowerCase().includes(k));

  document.getElementById("agentPanel").style.display = isSummary ? "none" : "block";
  document.getElementById("answerPanel").style.display = "none";
  document.getElementById("metricsPanel").style.display = "none";
  document.getElementById("timeline").innerHTML = "";
  document.getElementById("agentSpinner").style.display = "block";
  document.getElementById("submitBtn").disabled = true;
  document.getElementById("submitBtn").textContent = "Processing...";

  // Track whether SSE has already streamed a real answer into the box
  let sseAnswerReceived = false;

  let evtSource = null;

  if (!isSummary) {
    evtSource = new EventSource(`ask.php?stream=1&request_id=${requestId}`);
    document.getElementById("answerPanel").style.display = "block";
    document.getElementById("answerBox").textContent = "";
    document.getElementById("answerBox").setAttribute("data-streaming", "true");

    evtSource.onmessage = function(e) {
      const data = JSON.parse(e.data);
      if (data.type === "heartbeat") return;
      if (data.type === "done") {
        evtSource.close();
        document.getElementById("agentSpinner").style.display = "none";
        document.getElementById("answerBox").removeAttribute("data-streaming");
        return;
      }
      if (data.type === "stream_start") {
        document.getElementById("answerPanel").style.display = "block";
        document.getElementById("answerBox").setAttribute("data-streaming", "true");
        return;
      }
      if (data.type === "token") {
        const box = document.getElementById("answerBox");
        document.getElementById("answerPanel").style.display = "block";
        box.textContent += data.message;
        box.scrollTop = box.scrollHeight;
        // Mark that we received real streamed content
        if (data.message && data.message.trim()) {
          sseAnswerReceived = true;
        }
        return;
      }
      addTimelineEvent(data.type, data.message);
    };

    evtSource.onerror = function() { evtSource.close(); };

  } else {
    document.getElementById("agentPanel").style.display = "block";
    document.getElementById("timeline").innerHTML = "";
    addTimelineEvent("extract_start", "📄 Extracting PDF text...");
    addTimelineEvent("workflow_start", "⚙️ Running RAPTOR hierarchical summarization...");
  }

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 3600000);

  fetch("ask.php", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question, filename: uploadedFileName, request_id: requestId }),
    signal: controller.signal
  })
  .then(r => r.json())
  .then(data => {
    clearTimeout(timeout);
    if (evtSource) evtSource.close();
    document.getElementById("agentSpinner").style.display = "none";
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").textContent = "Run Agent →";

    const box = document.getElementById("answerBox");
    box.removeAttribute("data-streaming");
    document.getElementById("answerPanel").style.display = "block";

    // FIX: Only use the JSON answer as a fallback when the SSE stream
    // produced nothing at all. Never overwrite by length — short answers
    // like "10-20%" (6 chars) or "Geoff Hinton" are valid streamed answers
    // and must not be replaced.
    if (!sseAnswerReceived || !box.textContent.trim()) {
      box.textContent = data.answer || "No answer returned.";
    }

    if (data.metrics) showMetrics(data.metrics);
  })
  .catch(err => {
    clearTimeout(timeout);
    if (evtSource) evtSource.close();
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").textContent = "Run Agent →";
    document.getElementById("answerPanel").style.display = "block";
    document.getElementById("answerBox").textContent =
      err.name === "AbortError" ? "Request timed out." : "Error: " + err.message;
  });
}

function scoreClass(val, goodThresh, warnThresh) {
  if (val >= goodThresh) return "good";
  if (val >= warnThresh) return "warn";
  return "bad";
}

function showMetrics(m) {
  const grid = document.getElementById("metricsGrid");
  grid.innerHTML = "";

  // ── Core Performance ──
  grid.innerHTML += `<div class="metrics-section-title">📊 Core Performance</div>`;
  const core = [
    { label: "Type",       value: m.type === "summary" ? "Summary" : "Q&A", unit: "" },
    { label: "Total Time", value: formatTime(m.response_time_sec),           unit: "" },
    { label: "Extraction", value: formatTime(m.extraction_time_sec),         unit: "" },
  ];
  if (m.type === "summary") {
    core.push({ label: "Summary Time",   value: formatTime(m.summary_time_sec),               unit: "" });
    core.push({ label: "Summary Length", value: (m.summary_length_words||0).toLocaleString(), unit: "words" });
    core.push({ label: "LLM Calls",      value: m.llm_calls || "—",                           unit: "calls" });
  } else {
    core.push({ label: "QA Time",   value: formatTime(m.qa_time_sec), unit: "" });
    core.push({ label: "Model",     value: m.model_used || "—",       unit: "" });
    core.push({ label: "LLM Calls", value: m.llm_calls ?? "—",        unit: "calls" });
  }
  core.push({ label: "Pages",      value: m.pages_processed,                            unit: "pages" });
  core.push({ label: "Characters", value: (m.characters_processed||0).toLocaleString(), unit: "chars" });
  core.push({ label: "Words",      value: (m.words_processed||0).toLocaleString(),      unit: "words" });
  core.forEach(item => {
    grid.innerHTML += `<div class="metric-item"><div class="metric-label">${item.label}</div><div class="metric-value">${item.value}<span class="metric-unit"> ${item.unit}</span></div></div>`;
  });

  // ── Latency Metrics ──
  grid.innerHTML += `<div class="metrics-section-title">⚡ Latency Metrics</div>`;
  const ttft = parseFloat(m.ttft_sec || m.response_time_sec || 0);
  const e2e  = parseFloat(m.e2e_latency_sec || m.response_time_sec || 0);
  const tps  = parseFloat(m.tps || 0);
  [
    { label: "TTFT", sub: "Time To First Token", value: formatTime(ttft),
      note: ttft < e2e ? "✅ Streaming active!" : "= E2E (no streaming yet)",
      cls: ttft < e2e ? "good" : "warn" },
    { label: "E2E Latency", sub: "End To End", value: formatTime(e2e),
      note: "total response time", cls: "warn" },
    { label: "TPS", sub: "Tokens/Second", value: tps.toFixed(1),
      note: tps >= 5 ? "✅ Fast" : tps >= 2 ? "⚠️ Medium" : "❌ Slow",
      cls: tps >= 5 ? "good" : tps >= 2 ? "warn" : "bad" },
  ].forEach(item => {
    grid.innerHTML += `<div class="metric-item ${item.cls}"><div class="metric-label">${item.label} <span style="color:var(--muted);font-weight:400">· ${item.sub}</span></div><div class="metric-value">${item.value}</div><div style="font-size:10px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;">${item.note}</div></div>`;
  });

  // ── RAG Quality Metrics ──
  if (m.type !== "summary") {
    grid.innerHTML += `<div class="metrics-section-title">🎯 RAG Quality Metrics</div>`;
    const retrieval  = parseFloat(m.retrieval_score   || 0);
    const precision  = parseFloat(m.context_precision || 0);
    const grounding  = parseFloat(m.answer_grounding  || 0);
    const conf       = parseFloat((m.confidence_score || 0) * 100);
    const recallAtK  = parseFloat(m.recall_at_k       || 0);

    [
      {
        label: "Retrieval Score", sub: "Chunk Relevance",
        value: retrieval.toFixed(1) + "%",
        note:  retrieval >= 40 ? "✅ Good" : "⚠️ Low",
        cls:   scoreClass(retrieval, 40, 25)
      },
      {
        label: "Context Precision", sub: "Relevant/Retrieved",
        value: precision.toFixed(1) + "%",
        note:  precision >= 60 ? "✅ Precise" : "⚠️ Noisy",
        cls:   scoreClass(precision, 60, 40)
      },
      {
        label: "Answer Grounding", sub: "Grounded in Doc",
        value: grounding.toFixed(1) + "%",
        note:  grounding >= 50 ? "✅ Grounded" : "⚠️ Hallucination risk",
        cls:   scoreClass(grounding, 50, 30)
      },
      {
        label: "Confidence", sub: "Model Certainty",
        value: conf.toFixed(1) + "%",
        note:  conf >= 30 ? "✅ Confident" : "⚠️ Uncertain",
        cls:   scoreClass(conf, 30, 15)
      },
      {
        label: "Recall@K", sub: "Oracle Chunk Hit",
        value: recallAtK.toFixed(1) + "%",
        note:  recallAtK === 100  ? "✅ Oracle retrieved" :
               recallAtK >= 70   ? "✅ Very close to oracle" :
               recallAtK >= 40   ? "⚠️ Partial coverage" : "❌ Missed key chunk",
        cls:   scoreClass(recallAtK, 70, 40)
      },
    ].forEach(item => {
      grid.innerHTML += `<div class="metric-item ${item.cls}">
        <div class="metric-label">${item.label} <span style="color:var(--muted);font-weight:400">· ${item.sub}</span></div>
        <div class="metric-value">${item.value}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;">${item.note}</div>
      </div>`;
    });
  }

  document.getElementById("metricsPanel").style.display = "block";
}

document.getElementById("questionInput").addEventListener("keydown", e => {
  if (e.key === "Enter") askQuestion();
});
</script>
</body>

  font-family: 'JetBrains Mono', monospace;
}

.metric-unit {
  font-size: 11px;
  color: var(--muted);
  margin-left: 3px;
}
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>DocMind</h1>
    <p>Agentic Document Intelligence System</p>
    <div class="badge">LangGraph · ReAct · FAISS · RAPTOR · RoBERTa · LLaMA 3.2</div>
  </div>


  <div class="card">
    <div class="card-title">01 — Upload Document</div>
    <div class="upload-area" id="uploadArea">
      <input type="file" id="pdfUpload" accept="application/pdf">
      <div class="upload-icon">📄</div>
      <div class="upload-text">Drop PDF here or <span>browse</span></div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;">
        Supports digital + scanned PDFs · Any size
      </div>
    </div>
    <div class="upload-status" id="uploadStatus"></div>
  </div>


  <div class="card">
    <div class="card-title">02 — Ask Question or Request Summary</div>
    <div class="input-row">
      <input type="text" class="question-input" id="questionInput"
        placeholder="e.g. 'give summary' or 'list all ethical theories' or 'why is AI dangerous?'">
      <button class="submit-btn" id="submitBtn" onclick="askQuestion()">
        Run Agent →
      </button>
    </div>
  </div>


  <div class="card" id="agentPanel">
    <div class="agent-header">
      <div class="agent-spinner" id="agentSpinner"></div>
      <div class="agent-title">AGENT REASONING TRACE</div>
    </div>
    <div class="timeline" id="timeline"></div>
  </div>

 
  <div class="card" id="answerPanel">
    <div class="card-title">Answer</div>
    <div class="answer-box" id="answerBox"></div>
  </div>

 
  <div class="card" id="metricsPanel">
    <div class="card-title">Benchmark Metrics</div>
    <div class="metrics-grid" id="metricsGrid"></div>
  </div>

</div>

<script>
let uploadedFileName = "";

function formatTime(seconds) {
  seconds = parseFloat(seconds);
  if (isNaN(seconds)) return "—";
  if (seconds < 60) return seconds.toFixed(2) + " sec";
  const mins = Math.floor(seconds / 60);
  const secs = (seconds % 60).toFixed(2);
  return mins + " min " + secs + " sec";
}

function generateId() {
  return Math.random().toString(36).substr(2, 9);
}

// ---- Upload ----
const uploadArea = document.getElementById("uploadArea");
uploadArea.addEventListener("dragover", e => { e.preventDefault(); uploadArea.classList.add("dragover"); });
uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("dragover"));
uploadArea.addEventListener("drop", e => {
  e.preventDefault();
  uploadArea.classList.remove("dragover");
  const file = e.dataTransfer.files[0];
  if (file) { document.getElementById("pdfUpload").files = e.dataTransfer.files; doUpload(file); }
});
document.getElementById("pdfUpload").addEventListener("change", e => {
  if (e.target.files[0]) doUpload(e.target.files[0]);
});

function doUpload(file) {
  const status = document.getElementById("uploadStatus");
  status.className = "upload-status";
  status.textContent = "⏳ Uploading...";
  status.style.display = "block";

  const formData = new FormData();
  formData.append("file", file);

  fetch("upload.php", { method: "POST", body: formData })
    .then(r => r.json())
    .then(data => {
      if (data.status === "success") {
        uploadedFileName = data.filename;
        status.className = "upload-status success";
        status.textContent = "✅ " + uploadedFileName;
        document.querySelector('.upload-icon').textContent = "📋";
      } else {
        status.className = "upload-status error";
        status.textContent = "❌ " + data.message;
      }
    })
    .catch(() => {
      status.className = "upload-status error";
      status.textContent = "❌ Upload failed";
    });
}

const EVENT_CONFIG = {
  extract_start:  { icon: "📄", label: "EXTRACTION" },
  workflow_start: { icon: "⚙️", label: "WORKFLOW" },
  agent_start:    { icon: "🤖", label: "AGENT INIT" },
  agent_thought:  { icon: "💭", label: "REASONING" },
  agent_search:   { icon: "🔍", label: "SEARCHING" },
  agent_action:   { icon: "⚡", label: "ACTION" },
  agent_done:     { icon: "✅", label: "COMPLETE" },
  stream_start:   { icon: "✍️", label: "STREAMING" },
  heartbeat:      null,
  done:           null,
  token:          null,  // handled separately
};

function addTimelineEvent(type, message) {
  const cfg = EVENT_CONFIG[type];
  if (!cfg) return;

  const timeline = document.getElementById("timeline");
  const item = document.createElement("div");
  item.className = `timeline-item timeline-line event-${type}`;
  item.innerHTML = `
    <div class="timeline-dot">${cfg.icon}</div>
    <div class="timeline-content">
      <div class="timeline-label">${cfg.label}</div>
      <div class="timeline-message">${message}</div>
    </div>`;
  timeline.appendChild(item);
  item.scrollIntoView({ behavior: "smooth", block: "nearest" });
}


function askQuestion() {
  const question = document.getElementById("questionInput").value.trim();
  if (!question) { alert("Please enter a question."); return; }
  if (!uploadedFileName) { alert("Please upload a PDF first."); return; }

  const requestId = generateId();

 
  const summaryKeywords = ["summary", "summarize", "overview", "brief", "outline", "gist", "tldr"];
  const isSummary = summaryKeywords.some(k => question.toLowerCase().includes(k));

 
  document.getElementById("agentPanel").style.display = isSummary ? "none" : "block";
  document.getElementById("answerPanel").style.display = "none";
  document.getElementById("metricsPanel").style.display = "none";
  document.getElementById("timeline").innerHTML = "";
  document.getElementById("agentSpinner").style.display = "block";
  document.getElementById("submitBtn").disabled = true;
  document.getElementById("submitBtn").textContent = "Processing...";

  let evtSource = null;

  if (!isSummary) {
   
    evtSource = new EventSource(`ask.php?stream=1&request_id=${requestId}`);

    document.getElementById("answerPanel").style.display = "block";
    document.getElementById("answerBox").textContent = "";
    document.getElementById("answerBox").setAttribute("data-streaming", "true");

    evtSource.onmessage = function(e) {
      const data = JSON.parse(e.data);
      if (data.type === "heartbeat") return;
      if (data.type === "done") {
        evtSource.close();
        document.getElementById("agentSpinner").style.display = "none";
        document.getElementById("answerBox").removeAttribute("data-streaming");
        return;
      }
      if (data.type === "stream_start") {
        document.getElementById("answerPanel").style.display = "block";
        document.getElementById("answerBox").setAttribute("data-streaming", "true");
        return;
      }
      if (data.type === "token") {
        const box = document.getElementById("answerBox");
        document.getElementById("answerPanel").style.display = "block";
        box.textContent += data.message;
        box.scrollTop = box.scrollHeight;
        return;
      }
      addTimelineEvent(data.type, data.message);
    };

    evtSource.onerror = function() { evtSource.close(); };

  } else {

    document.getElementById("agentPanel").style.display = "block";
    document.getElementById("timeline").innerHTML = "";
    addTimelineEvent("extract_start", "📄 Extracting PDF text...");
    addTimelineEvent("workflow_start", "⚙️ Running RAPTOR hierarchical summarization...");
  }

 
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 3600000);

  fetch("ask.php", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      question,
      filename: uploadedFileName,
      request_id: requestId
    }),
    signal: controller.signal
  })
  .then(r => r.json())
  .then(data => {
    clearTimeout(timeout);
    if (evtSource) evtSource.close();
    document.getElementById("agentSpinner").style.display = "none";
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").textContent = "Run Agent →";

    
    const box = document.getElementById("answerBox");
    box.removeAttribute("data-streaming");
    document.getElementById("answerPanel").style.display = "block";
    if (!box.textContent.trim() || box.textContent.length < 20) {
      box.textContent = data.answer;
    }


    if (data.metrics) showMetrics(data.metrics);
  })
  .catch(err => {
    clearTimeout(timeout);
    if (evtSource) evtSource.close();
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").textContent = "Run Agent →";
    document.getElementById("answerPanel").style.display = "block";
    document.getElementById("answerBox").textContent =
      err.name === "AbortError" ? "Request timed out." : "Error: " + err.message;
  });
}

function scoreClass(val, goodThresh, warnThresh) {
  if (val >= goodThresh) return "good";
  if (val >= warnThresh) return "warn";
  return "bad";
}

function showMetrics(m) {
  const grid = document.getElementById("metricsGrid");
  grid.innerHTML = "";


  grid.innerHTML += `<div class="metrics-section-title">📊 Core Performance</div>`;
  const core = [
    { label: "Type",       value: m.type === "summary" ? "Summary" : "Q&A", unit: "" },
    { label: "Total Time", value: formatTime(m.response_time_sec),           unit: "" },
    { label: "Extraction", value: formatTime(m.extraction_time_sec),         unit: "" },
  ];
  if (m.type === "summary") {
    core.push({ label: "Summary Time",   value: formatTime(m.summary_time_sec),               unit: "" });
    core.push({ label: "Summary Length", value: (m.summary_length_words||0).toLocaleString(), unit: "words" });
    core.push({ label: "LLM Calls",      value: m.llm_calls || "—",                           unit: "calls" });
  } else {
    core.push({ label: "QA Time",   value: formatTime(m.qa_time_sec), unit: "" });
    core.push({ label: "Model",     value: m.model_used || "—",       unit: "" });
    core.push({ label: "LLM Calls", value: m.llm_calls ?? "—",        unit: "calls" });
  }
  core.push({ label: "Pages",      value: m.pages_processed,                            unit: "pages" });
  core.push({ label: "Characters", value: (m.characters_processed||0).toLocaleString(), unit: "chars" });
  core.push({ label: "Words",      value: (m.words_processed||0).toLocaleString(),      unit: "words" });
  core.forEach(item => {
    grid.innerHTML += `<div class="metric-item"><div class="metric-label">${item.label}</div><div class="metric-value">${item.value}<span class="metric-unit"> ${item.unit}</span></div></div>`;
  });

  
  grid.innerHTML += `<div class="metrics-section-title">⚡ Latency Metrics</div>`;
  const ttft = parseFloat(m.ttft_sec || m.response_time_sec || 0);
  const e2e  = parseFloat(m.e2e_latency_sec || m.response_time_sec || 0);
  const tps  = parseFloat(m.tps || 0);
  [
    { label: "TTFT", sub: "Time To First Token", value: formatTime(ttft),
      note: ttft < e2e ? "✅ Streaming active!" : "= E2E (no streaming yet)",
      cls: ttft < e2e ? "good" : "warn" },
    { label: "E2E Latency", sub: "End To End",   value: formatTime(e2e),  note: "total response time",      cls: "warn" },
    { label: "TPS", sub: "Tokens/Second",        value: tps.toFixed(1),   note: tps >= 5 ? "✅ Fast" : tps >= 2 ? "⚠️ Medium" : "❌ Slow", cls: tps >= 5 ? "good" : tps >= 2 ? "warn" : "bad" },
  ].forEach(item => {
    grid.innerHTML += `<div class="metric-item ${item.cls}"><div class="metric-label">${item.label} <span style="color:var(--muted);font-weight:400">· ${item.sub}</span></div><div class="metric-value">${item.value}</div><div style="font-size:10px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;">${item.note}</div></div>`;
  });


  if (m.type !== "summary") {
    grid.innerHTML += `<div class="metrics-section-title">🎯 RAG Quality Metrics</div>`;
    const retrieval = parseFloat(m.retrieval_score   || 0);
    const precision = parseFloat(m.context_precision || 0);
    const grounding = parseFloat(m.answer_grounding  || 0);
    const conf      = parseFloat((m.confidence_score || 0) * 100);
    [
      { label: "Retrieval Score",    sub: "Chunk Relevance",     value: retrieval.toFixed(1)+"%", note: retrieval >= 40 ? "✅ Good" : "⚠️ Low",        cls: scoreClass(retrieval, 40, 25) },
      { label: "Context Precision",  sub: "Relevant/Retrieved",  value: precision.toFixed(1)+"%", note: precision >= 60 ? "✅ Precise" : "⚠️ Noisy",    cls: scoreClass(precision, 60, 40) },
      { label: "Answer Grounding",   sub: "Grounded in Doc",     value: grounding.toFixed(1)+"%", note: grounding >= 50 ? "✅ Grounded" : "⚠️ Hallucination risk", cls: scoreClass(grounding, 50, 30) },
      { label: "Confidence",         sub: "Model Certainty",     value: conf.toFixed(1)+"%",      note: conf >= 30 ? "✅ Confident" : "⚠️ Uncertain",   cls: scoreClass(conf, 30, 15) },
      { label: "Recall",             sub: "Coverage of Doc",     value: (parseFloat(m.recall_score||0)).toFixed(1)+"%", note: parseFloat(m.recall_score||0) >= 50 ? "✅ Good coverage" : "⚠️ Missing chunks", cls: scoreClass(parseFloat(m.recall_score||0), 50, 30) },
    ].forEach(item => {
      grid.innerHTML += `<div class="metric-item ${item.cls}"><div class="metric-label">${item.label} <span style="color:var(--muted);font-weight:400">· ${item.sub}</span></div><div class="metric-value">${item.value}</div><div style="font-size:10px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;">${item.note}</div></div>`;
    });
  }

  document.getElementById("metricsPanel").style.display = "block";
}


document.getElementById("questionInput").addEventListener("keydown", e => {
  if (e.key === "Enter") askQuestion();
});
</script>
</body>
</html>

/* Section divider */

  margin: 4px 0;
  padding-top: 10px;
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* Metric color classes */
.metric-item.good .metric-value { color: var(--accent2); }
.metric-item.warn .metric-value { color: var(--accent3); }
.metric-item.bad  .metric-value { color: #ef4444; }

/* Section dividers */
.metrics-section-title {
  grid-column: 1/-1;
  border-top: 1px solid var(--border);
  margin: 4px 0;
  padding-top: 10px;
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 6px;
}

/* Metrics */
#metricsPanel { display: none; }

.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
  margin-top: 12px;
}

.metric-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
}

.metric-label {
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}

.metric-value {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
  font-family: 'JetBrains Mono', monospace;
}

  color: var(--muted);
  margin-left: 3px;
